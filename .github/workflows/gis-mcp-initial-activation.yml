name: GIS MCP Initial Activation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Activation operation'
        required: true
        type: choice
        options: [prepare, status, publish, rollback, recover]
      activation_id:
        description: 'Unique lowercase activation ID (8-64 characters)'
        required: true
        type: string
      client_id:
        description: 'Lowercase GIS MCP client ID'
        required: true
        type: string
      expected_caddyfile_sha256:
        description: 'Exact pre-activation Caddyfile SHA-256 from the approved audit'
        required: true
        type: string
      pending_digest_commitment:
        description: 'SHA-256 of canonical JSON {version,operationId,action,clientId,tokenSha256}'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gis-mcp-initial-activation-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: gis-mcp-registry
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate, bind, and run the EC2 activation operation
        shell: bash
        env:
          ACTIVATION_EVENT_NAME: ${{ github.event_name }}
          ACTIVATION_REF: ${{ github.ref }}
          ACTIVATION_GITHUB_SHA: ${{ github.sha }}
          ACTIVATION_OPERATION: ${{ inputs.operation }}
          ACTIVATION_ID: ${{ inputs.activation_id }}
          ACTIVATION_CLIENT_ID: ${{ inputs.client_id }}
          ACTIVATION_EXPECTED_CADDYFILE_SHA256: ${{ inputs.expected_caddyfile_sha256 }}
          ACTIVATION_TOKEN_COMMITMENT: ${{ inputs.pending_digest_commitment }}
          ACTIVATION_PENDING_SHA256: ${{ secrets.GIS_MCP_REGISTRY_PENDING_SHA256 }}
          ACTIVATION_RUN_ID: ${{ github.run_id }}
          ACTIVATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          umask 077

          [[ "${ACTIVATION_EVENT_NAME}" == "workflow_dispatch" ]] \
            || { echo "::error::workflow_dispatch is required."; exit 1; }
          [[ "${ACTIVATION_REF}" == "refs/heads/main" ]] \
            || { echo "::error::refs/heads/main is required."; exit 1; }
          [[ "${ACTIVATION_OPERATION}" =~ ^(prepare|status|publish|rollback|recover)$ ]] \
            || { echo "::error::Invalid operation."; exit 1; }
          [[ "${#ACTIVATION_ID}" -ge 8 && "${#ACTIVATION_ID}" -le 64 \
            && "${ACTIVATION_ID}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || { echo "::error::Invalid activation_id."; exit 1; }
          [[ "${#ACTIVATION_CLIENT_ID}" -le 64 \
            && "${ACTIVATION_CLIENT_ID}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || { echo "::error::Invalid client_id."; exit 1; }
          [[ "${ACTIVATION_EXPECTED_CADDYFILE_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::Invalid expected Caddyfile digest."; exit 1; }
          [[ "${ACTIVATION_TOKEN_COMMITMENT}" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::Invalid pending digest commitment."; exit 1; }
          [[ "${ACTIVATION_GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Invalid GitHub revision."; exit 1; }
          [[ "${ACTIVATION_RUN_ID}" =~ ^[1-9][0-9]*$ \
            && "${ACTIVATION_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::Invalid run identity."; exit 1; }

          if [[ "${ACTIVATION_OPERATION}" != "status" ]]; then
            [[ "${ACTIVATION_RUN_ATTEMPT}" == "1" ]] \
              || { echo "::error::State-changing activation operations cannot be re-run."; exit 1; }
          fi

          pending_digest="${ACTIVATION_PENDING_SHA256:-}"
          unset ACTIVATION_PENDING_SHA256
          if [[ -n "${pending_digest}" ]]; then
            printf '::add-mask::%s\n' "${pending_digest}"
            [[ "${pending_digest}" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::Pending digest secret is invalid."; exit 1; }
            actual_commitment="$(
              printf '%s' \
                "{\"version\":1,\"operationId\":\"${ACTIVATION_ID}\",\"action\":\"add\",\"clientId\":\"${ACTIVATION_CLIENT_ID}\",\"tokenSha256\":\"${pending_digest}\"}" \
                | sha256sum | awk '{print $1}'
            )"
            [[ "${actual_commitment}" == "${ACTIVATION_TOKEN_COMMITMENT}" ]] \
              || { echo "::error::Pending digest commitment does not bind this dispatch."; exit 1; }
            unset actual_commitment
          elif [[ "${ACTIVATION_OPERATION}" == "prepare" ]]; then
            echo "::error::prepare requires GIS_MCP_REGISTRY_PENDING_SHA256."
            exit 1
          fi

          missing=0
          for name in EC2_HOST EC2_USERNAME EC2_SSH_KEY EC2_SSH_FINGERPRINT; do
            [[ -n "${!name:-}" ]] || missing=1
          done
          [[ "${missing}" -eq 0 ]] \
            || { echo "::error::Required EC2 connection secret is missing."; exit 1; }
          [[ "${EC2_USERNAME}" =~ ^[a-z_][a-z0-9_-]*$ ]] \
            || { echo "::error::Invalid EC2 username."; exit 1; }
          [[ "${#EC2_HOST}" -le 253 \
            && "${EC2_HOST}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] \
            || { echo "::error::Invalid EC2 host."; exit 1; }
          [[ -f scripts/gis-mcp-initial-activation-remote.sh \
            && ! -L scripts/gis-mcp-initial-activation-remote.sh ]] \
            || { echo "::error::Remote activation script is missing."; exit 1; }
          bash -n scripts/gis-mcp-initial-activation-remote.sh
          [[ "$(git rev-parse HEAD)" == "${ACTIVATION_GITHUB_SHA}" ]] \
            || { echo "::error::Checkout does not match the dispatched revision."; exit 1; }

          script_sha256="$(
            sha256sum scripts/gis-mcp-initial-activation-remote.sh | awk '{print $1}'
          )"
          [[ "${script_sha256}" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::Remote activation script digest is invalid."; exit 1; }

          local_root="${RUNNER_TEMP}/gis-mcp-activation-${ACTIVATION_RUN_ID}-${ACTIVATION_RUN_ATTEMPT}"
          install -d -m 700 "${local_root}"
          key_path="${local_root}/id"
          known_hosts_path="${local_root}/known_hosts"
          install -m 600 /dev/null "${key_path}"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_path}"

          host_keys="$(ssh-keyscan -T 10 -t ed25519,ecdsa,rsa "${EC2_HOST}" 2>/dev/null)"
          [[ -n "${host_keys}" ]] \
            || { echo "::error::Host key scan failed."; exit 1; }
          matched=""
          while IFS= read -r host_key; do
            fingerprint="$(
              printf '%s\n' "${host_key}" \
                | ssh-keygen -lf - -E sha256 | awk '{print $2}'
            )"
            if [[ "${fingerprint}" == "${EC2_SSH_FINGERPRINT}" ]]; then
              matched="${host_key}"
              break
            fi
          done <<< "${host_keys}"
          [[ -n "${matched}" ]] \
            || { echo "::error::EC2 fingerprint mismatch."; exit 1; }
          printf '%s\n' "${matched}" > "${known_hosts_path}"
          chmod 600 "${known_hosts_path}"

          ssh_options=(
            -i "${key_path}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -o "UserKnownHostsFile=${known_hosts_path}"
          )
          run_key="${ACTIVATION_RUN_ID}-${ACTIVATION_RUN_ATTEMPT}"
          remote_parent="alimtalk-proxy/.gis-mcp-initial-activation-runs"
          remote_root="${remote_parent}/${run_key}"
          remote_prepared=0

          cleanup() {
            status=$?
            trap - EXIT INT TERM HUP
            set +e
            if [[ "${remote_prepared}" == "1" ]]; then
              ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
                "RUN_KEY='${run_key}' bash -s" >/dev/null 2>&1 <<'REMOTE_CLEANUP'
          set -euo pipefail
          [[ "${RUN_KEY}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          root="${HOME}/alimtalk-proxy/.gis-mcp-initial-activation-runs/${RUN_KEY}"
          script="${root}/operator.sh"
          [[ -d "${root}" && ! -L "${root}" \
            && "$(stat -c '%u:%a' "${root}")" == "$(id -u):700" ]]
          if [[ -e "${script}" || -L "${script}" ]]; then
            [[ -f "${script}" && ! -L "${script}" \
              && "$(stat -c '%u' "${script}")" == "$(id -u)" ]]
            rm -f -- "${script}"
          fi
          rmdir -- "${root}"
          parent="${HOME}/alimtalk-proxy/.gis-mcp-initial-activation-runs"
          rmdir --ignore-fail-on-non-empty "${parent}"
          REMOTE_CLEANUP
            fi
            unset pending_digest
            rm -f -- "${key_path}" "${known_hosts_path}" >/dev/null 2>&1 || true
            rmdir -- "${local_root}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP

          ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "RUN_KEY='${run_key}' bash -s" <<'REMOTE_PREPARE'
          set -euo pipefail
          umask 077
          [[ "${RUN_KEY}" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          parent="${HOME}/alimtalk-proxy/.gis-mcp-initial-activation-runs"
          root="${parent}/${RUN_KEY}"
          if [[ ! -e "${parent}" && ! -L "${parent}" ]]; then
            mkdir -m 700 -- "${parent}"
          fi
          [[ -d "${parent}" && ! -L "${parent}" \
            && "$(stat -c '%u:%a' "${parent}")" == "$(id -u):700" ]]
          [[ ! -e "${root}" && ! -L "${root}" ]]
          mkdir -m 700 -- "${root}"
          REMOTE_PREPARE
          remote_prepared=1

          scp "${ssh_options[@]}" \
            scripts/gis-mcp-initial-activation-remote.sh \
            "${EC2_USERNAME}@${EC2_HOST}:${remote_root}/operator.sh"
          ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
            "chmod 600 '${remote_root}/operator.sh'"

          remote_command="ACTIVATION_OPERATION='${ACTIVATION_OPERATION}' \
          ACTIVATION_ID='${ACTIVATION_ID}' \
          ACTIVATION_CLIENT_ID='${ACTIVATION_CLIENT_ID}' \
          ACTIVATION_TOKEN_COMMITMENT='${ACTIVATION_TOKEN_COMMITMENT}' \
          ACTIVATION_EXPECTED_CADDYFILE_SHA256='${ACTIVATION_EXPECTED_CADDYFILE_SHA256}' \
          ACTIVATION_EXPECTED_SCRIPT_SHA256='${script_sha256}' \
          ACTIVATION_GITHUB_SHA='${ACTIVATION_GITHUB_SHA}' \
          bash '${remote_root}/operator.sh'"

          set +e
          if [[ "${ACTIVATION_OPERATION}" == "prepare" ]]; then
            printf '%s\n' "${pending_digest}" \
              | ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" "${remote_command}"
            remote_status="${PIPESTATUS[1]}"
          else
            ssh "${ssh_options[@]}" "${EC2_USERNAME}@${EC2_HOST}" \
              "${remote_command}" </dev/null
            remote_status=$?
          fi
          set -e
          unset pending_digest
          exit "${remote_status}"
