                  || [[ "${gis_registry_required_at_start}" -ne 1 ]] \
                  || [[ "${gis_registry_finalization_required}" -ne 0 ]] \
                  || [[ "${gis_registry_needs_next_env}" -ne 0 ]] \
                  || [[ "${gis_registry_json_source_at_start}" -ne 0 ]] \
                  || [[ -n "${gis_registry_env_next}" ]]; then
                  echo "GIS MCP receipt-only SHA-drift recovery requires committed GIS file mode."
                  false
                fi
              elif [[ "${gis_initial_activation_historical_finalization_required}" -eq 1 ]]; then
                if [[ "${gis_registry_marker_present}" -ne 0 ]] \
                  || [[ "${gis_registry_finalization_required}" -ne 1 ]] \
                  || [[ "${gis_initial_activation_running_file_mode_at_start}" -ne 1 ]] \
                  || [[ -e "${gis_registry_marker}" || -L "${gis_registry_marker}" ]]; then
                  echo "GIS MCP historical SHA recovery has an invalid pre-marker state."
                  false
                fi
                if [[ "${gis_registry_json_source_at_start}" -eq 1 ]]; then
                  if [[ "${gis_registry_required_at_start}" -ne 0 ]] \
                    || [[ "${gis_registry_needs_next_env}" -ne 1 ]] \
                    || [[ -z "${gis_registry_env_next}" ]]; then
                    echo "GIS MCP historical JSON recovery is missing its staged file-only environment."
                    false
                  fi
                elif [[ "${gis_registry_json_source_at_start}" -ne 0 ]] \
                  || { [[ "${gis_registry_needs_next_env}" -eq 1 ]] \
                    && [[ -z "${gis_registry_env_next}" ]]; }; then
                  echo "GIS MCP historical file recovery has an invalid environment state."
                  false
                fi
              else
                echo "GIS MCP activation historical finalization policy is invalid."
                false
              fi
              if ! docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
                || [[ "$(docker container inspect --format '{{.State.Running}}' "${CONTAINER_NAME}")" != "true" ]] \
                || docker container inspect "${CANDIDATE_CONTAINER}" >/dev/null 2>&1; then
                echo "GIS MCP activation SHA-drift recovery requires one running committed container."
                false
              fi
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                if [[ "${gis_initial_activation_historical_finalization_required}" -ne 1 ]] \
                  || [[ "$(docker container inspect --format '{{.State.Running}}' "${ROLLBACK_CONTAINER}")" == "true" ]]; then
                  echo "GIS MCP activation SHA-drift recovery found an unsafe rollback container."
                  false
                fi
              fi
              if ! verify_file_registry_container_contract "${CONTAINER_NAME}" \
                || ! verify_gis_file_registry_container_contract "${CONTAINER_NAME}" \
                || ! verify_status_ok "${CONTAINER_NAME}" 3100 \
                || ! verify_legal_registry_health "${CONTAINER_NAME}" 3100 \
                || ! verify_gis_registry_health "${CONTAINER_NAME}" 3100 \
                || ! verify_gis_initial_activation_running_git_sha \
                  "${CONTAINER_NAME}" 3100; then
                echo "Running container does not prove the durable GIS MCP activation state."
                false
              fi

              deployment_phase="committed"
              if [[ "${gis_initial_activation_historical_finalization_required}" -eq 1 ]]; then
                if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  if ! docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 \
                    || docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                    echo "CLEANUP_FAILED: historical GIS rollback container could not be removed."
                    exit 71
                  fi
                fi

                if [[ -n "${gis_registry_env_next}" ]]; then
                  if ! mv -f -- "${gis_registry_env_next}" .env; then
                    echo "CLEANUP_FAILED: historical GIS file-only environment could not be installed."
                    exit 71
                  fi
                  gis_registry_env_next=""
                  gis_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
                  deployment_runtime_env="${HOME}/alimtalk-proxy/.env"
                fi
                if [[ ! -f .env || -L .env ]] \
                  || [[ "$(stat -c '%u' .env)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' .env)" != "600" ]] \
                  || [[ "$(grep -Fxc "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" .env || true)" != "1" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' .env || true)" != "0" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_SHA256[[:space:]]*=' .env || true)" != "0" ]]; then
                  echo "CLEANUP_FAILED: historical GIS file-only environment validation failed."
                  exit 71
                fi

                gis_registry_marker_next=""
                if ! gis_registry_marker_next="$(
                  mktemp "${HOME}/alimtalk-proxy/.gis-mcp-file-registry-v1.next.XXXXXX"
                )" \
                  || ! chmod 600 "${gis_registry_marker_next}" \
                  || ! printf 'version=1\n' > "${gis_registry_marker_next}" \
                  || ! mv -- "${gis_registry_marker_next}" "${gis_registry_marker}"; then
                  if [[ -n "${gis_registry_marker_next}" ]]; then
                    rm -f -- "${gis_registry_marker_next}" >/dev/null 2>&1 || true
                  fi
                  echo "CLEANUP_FAILED: historical GIS marker installation failed."
                  exit 71
                fi
                gis_registry_marker_next=""
                if [[ ! -f "${gis_registry_marker}" || -L "${gis_registry_marker}" ]] \
                  || [[ "$(stat -c '%u' "${gis_registry_marker}")" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_registry_marker}")" != "600" ]] \
                  || [[ "$(<"${gis_registry_marker}")" != "version=1" ]]; then
                  echo "CLEANUP_FAILED: historical GIS marker validation failed."
                  exit 71
                fi
                gis_registry_marker_present=1
                gis_registry_required_at_start=1
                gis_registry_finalization_required=0
                gis_registry_needs_next_env=0
                gis_registry_json_source_at_start=0
                gis_initial_activation_historical_finalization_required=0
              fi
              if ! consume_gis_initial_activation_handoff; then
                echo "CLEANUP_FAILED: GIS MCP activation SHA-drift receipt could not be committed."
                exit 71
              fi
              deployment_phase="complete"
              echo "GIS MCP activation receipt recovered without replacing the running image."
              exit 0
            fi

            manifest_attestation="$(
              docker run --rm \
                --env-file .env \
                "${IMAGE}" \
                node dist/cli/land-area-sync-allowlist-manifest.js
            )"
            IFS=':' read -r actual_allowlist_count actual_allowlist_digest manifest_extra \
              <<< "${manifest_attestation}"
            if [[ -n "${manifest_extra:-}" ]] \
              || [[ ! "${actual_allowlist_count}" =~ ^[0-9]+$ ]] \
              || { [[ "${actual_allowlist_count}" -gt 0 ]] \
                && [[ ! "${actual_allowlist_digest}" =~ ^[0-9a-f]{64}$ ]]; }; then
              echo "Candidate image returned an invalid allowlist attestation."
              false
            fi
            if [[ "${expected_land_area_sync_enabled}" == "true" ]]; then
              if [[ "${actual_allowlist_count}" != "${EXPECTED_ALLOWLIST_COUNT}" ]] \
                || [[ "${actual_allowlist_digest}" != "${EXPECTED_ALLOWLIST_DIGEST}" ]]; then
                echo "EC2 allowlist does not match the approved workflow_dispatch artifact."
                false
              fi
            elif [[ "${actual_allowlist_count}" != "0" ]] \
              || [[ -n "${actual_allowlist_digest}" ]]; then
              echo "Disabled LAND_AREA_SYNC attestation must be exactly count=0,digest=empty."
              false
            fi

            verify_health() {
              local container_name="$1"
              local port="$2"

              for attempt in $(seq 1 30); do
                if curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${port}/health" \
                  | docker exec -i \
                      -e EXPECTED_GIT_SHA="${EXPECTED_GIT_SHA}" \
                      -e EXPECTED_BUILD_TIME="${EXPECTED_BUILD_TIME}" \
                      -e EXPECTED_IMAGE_TAG="${EXPECTED_IMAGE_TAG}" \
                      -e EXPECTED_LAND_AREA_SYNC_ENABLED="${expected_land_area_sync_enabled}" \
                      -e EXPECTED_ALLOWLIST_COUNT="${actual_allowlist_count}" \
                      -e EXPECTED_ALLOWLIST_DIGEST="${actual_allowlist_digest}" \
                      -e EXPECTED_LEGAL_MCP_CLIENT_COUNT="${legal_registry_client_count}" \
                      -e EXPECTED_GIS_MCP_REGISTRY_ACTIVE="${gis_registry_active_for_deployment}" \
                      -e EXPECTED_GIS_MCP_CLIENT_COUNT="${gis_registry_client_count}" \
                      "${container_name}" \
                      node -e '
                        let body = "";
                        process.stdin.setEncoding("utf8");
                        process.stdin.on("data", (chunk) => { body += chunk; });
                        process.stdin.on("end", () => {
                          try {
                            const health = JSON.parse(body);
                            const gisRegistryValid = process.env.EXPECTED_GIS_MCP_REGISTRY_ACTIVE === "1"
                              ? (
                                health.features?.gisMcpConfigurationValid === true
                                && health.features?.gisMcpAuthMode === "client_registry"
                                && health.features?.gisMcpAuthSource === "file_registry"
                                && health.features?.gisMcpProviderMode === "vworld_and_data_portal"
                                && String(health.features?.gisMcpRegisteredClientCount)
                                  === process.env.EXPECTED_GIS_MCP_CLIENT_COUNT
                                && String(health.features?.gisMcpRegisteredTokenCount)
                                  === process.env.EXPECTED_GIS_MCP_CLIENT_COUNT
                              )
                              : process.env.EXPECTED_GIS_MCP_REGISTRY_ACTIVE === "0"
                                && health.features?.gisMcpConfigurationValid === false
                                && health.features?.gisMcpAuthMode === "disabled"
                                && health.features?.gisMcpAuthSource === "disabled"
                                && health.features?.gisMcpProviderMode === "disabled"
                                && String(health.features?.gisMcpRegisteredClientCount) === "0"
                                && String(health.features?.gisMcpRegisteredTokenCount) === "0";
                            const valid = health.status === "ok"
                              && health.gitSha === process.env.EXPECTED_GIT_SHA
                              && health.buildTime === process.env.EXPECTED_BUILD_TIME
                              && health.imageTag === process.env.EXPECTED_IMAGE_TAG
                              && String(health.features?.landAreaSyncEnabled)
                                === process.env.EXPECTED_LAND_AREA_SYNC_ENABLED
                              && String(health.features?.landAreaSyncAllowedTargetCount)
                                === process.env.EXPECTED_ALLOWLIST_COUNT
                              && health.features?.landAreaSyncAllowedTargetsDigest
                                === process.env.EXPECTED_ALLOWLIST_DIGEST
                              && health.features?.legalMcpConfigurationValid === true
                              && health.features?.legalMcpAuthMode === "client_registry"
                              && health.features?.legalMcpAuthSource === "file_registry"
                              && String(health.features?.legalMcpRegisteredClientCount)
                                === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT
                              && String(health.features?.legalMcpRegisteredTokenCount)
                                === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT
                              && gisRegistryValid;
                            process.exit(valid ? 0 : 1);
                          } catch {
                            process.exit(1);
                          }
                        });
                      ' >/dev/null 2>&1
                then
                  return 0
                fi
                sleep 2
              done

              return 1
            }

            docker rm -f "${CANDIDATE_CONTAINER}" >/dev/null 2>&1 || true
            candidate_started=1
            docker run -d \
              --name "${CANDIDATE_CONTAINER}" \
              --restart no \
              -p 127.0.0.1:13100:3100 \
              --env-file "${deployment_runtime_env}" \
              --mount \
                "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
              "${gis_registry_mount_args[@]}" \
              --memory=800m \
              --memory-swap=1600m \
              "${IMAGE}"

            EXPECTED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
            CANDIDATE_IMAGE_ID="$(docker container inspect --format '{{.Image}}' "${CANDIDATE_CONTAINER}")"
            if [[ "${CANDIDATE_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
              echo "Candidate container image ID does not match the pulled immutable image."
              false
            fi

            if ! verify_health "${CANDIDATE_CONTAINER}" 13100; then
              echo "Candidate health response did not match git SHA ${EXPECTED_GIT_SHA}."
              false
            fi
            if ! verify_file_registry_container_contract "${CANDIDATE_CONTAINER}"; then
              echo "Candidate did not preserve the legal MCP file-registry contract."
              false
            fi
            if [[ "${gis_registry_active_for_deployment}" -eq 1 ]] \
              && ! verify_gis_file_registry_container_contract "${CANDIDATE_CONTAINER}"; then
              echo "Candidate did not preserve the GIS MCP file-registry contract."
              false
            fi

            docker rm -f "${CANDIDATE_CONTAINER}"
            candidate_started=0

            if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
              had_previous=1
              previous_image_id="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                docker rm -f "${ROLLBACK_CONTAINER}"
              fi
              docker stop "${CONTAINER_NAME}"
              docker rename "${CONTAINER_NAME}" "${ROLLBACK_CONTAINER}"
            fi

            new_container_attempted=1
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p 127.0.0.1:3100:3100 \
              --env-file "${deployment_runtime_env}" \
              --mount \
                "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
              "${gis_registry_mount_args[@]}" \
              -v "$(pwd)/logs:/app/logs" \
              --memory=800m \
              --memory-swap=1600m \
              "${IMAGE}"

            RUNNING_IMAGE_ID="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
            if [[ "${RUNNING_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
              echo "Running container image ID does not match the pulled immutable image."
              false
            fi

            if ! verify_health "${CONTAINER_NAME}" 3100; then
              echo "Health response did not match git SHA ${EXPECTED_GIT_SHA}."
              false
            fi
            if ! verify_file_registry_container_contract "${CONTAINER_NAME}"; then
              echo "Running container did not preserve the legal MCP file-registry contract."
              false
            fi
            if [[ "${gis_registry_active_for_deployment}" -eq 1 ]] \
              && ! verify_gis_file_registry_container_contract "${CONTAINER_NAME}"; then
              echo "Running container did not preserve the GIS MCP file-registry contract."
              false
            fi

            # file-mode final health를 commit point로 삼는다. 이 후에는
            # 구 env registry container를 다시 실행하지 않는다.
            deployment_phase="committed"
            if [[ "${legal_registry_finalization_required}" -eq 1 ]]; then
              legal_registry_cleanup_failed=0

              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                if ! docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  legal_registry_cleanup_failed=1
                fi
              fi
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                echo "CLEANUP_FAILED: legacy rollback container still exists."
                legal_registry_cleanup_failed=1
              else
                had_previous=0
              fi

              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]] \
                && [[ -n "${legal_registry_env_next}" ]]; then
                if mv -f -- "${legal_registry_env_next}" .env; then
                  legal_registry_env_next=""
                  legal_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
                else
                  legal_registry_cleanup_failed=1
                fi
              fi

              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]]; then
                if [[ ! -f .env || -L .env ]] \
                  || [[ "$(stat -c '%u' .env)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' .env)" != "600" ]] \
                  || [[ "$(grep -Fxc "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" .env || true)" != "1" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' .env || true)" != "0" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=' .env || true)" != "0" ]]; then
                  echo "CLEANUP_FAILED: file-only runtime .env validation failed."
                  legal_registry_cleanup_failed=1
                fi
              fi

              legal_registry_marker_next=""
              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]]; then
                if legal_registry_marker_next="$(
                  mktemp "${HOME}/alimtalk-proxy/.legal-mcp-file-registry-v1.next.XXXXXX"
                )" \
                  && chmod 600 "${legal_registry_marker_next}" \
                  && printf 'version=1\n' > "${legal_registry_marker_next}" \
                  && mv -f -- "${legal_registry_marker_next}" "${legal_registry_marker}"; then
                  legal_registry_marker_next=""
                else
                  echo "CLEANUP_FAILED: legal MCP migration marker installation failed."
                  legal_registry_cleanup_failed=1
                fi
              fi
              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]] \
                && { [[ ! -f "${legal_registry_marker}" ]] \
                  || [[ -L "${legal_registry_marker}" ]] \
                  || [[ "$(stat -c '%u' "${legal_registry_marker}")" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${legal_registry_marker}")" != "600" ]] \
                  || [[ "$(<"${legal_registry_marker}")" != "version=1" ]]; }; then
                echo "CLEANUP_FAILED: legal MCP migration marker validation failed."
                legal_registry_cleanup_failed=1
              fi

              if [[ -n "${legal_registry_marker_next}" ]]; then
                rm -f -- "${legal_registry_marker_next}" >/dev/null 2>&1 || true
              fi
              if [[ -n "${legal_registry_env_next}" ]]; then
                if ! rm -f -- "${legal_registry_env_next}" >/dev/null 2>&1 \
                  || [[ -e "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]]; then
                  legal_registry_cleanup_failed=1
                fi
                legal_registry_env_next=""
              fi

              if [[ "${legal_registry_cleanup_failed}" -ne 0 ]]; then
                echo "CLEANUP_FAILED: file-mode container remains active; migration finalization requires review."
                exit 71
              fi
              echo "Legal MCP file-registry migration committed and legacy rollback removed."
            fi

            if [[ "${gis_registry_finalization_required}" -eq 1 ]]; then
              gis_registry_cleanup_failed=0

              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                if ! docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  gis_registry_cleanup_failed=1
                fi
              fi
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                echo "CLEANUP_FAILED: legacy rollback container still exists."
                gis_registry_cleanup_failed=1
              else
                had_previous=0
              fi

              if [[ "${gis_registry_cleanup_failed}" -eq 0 ]] \
                && [[ -n "${gis_registry_env_next}" ]]; then
                if mv -f -- "${gis_registry_env_next}" .env; then
                  gis_registry_env_next=""
                  gis_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
                  deployment_runtime_env="${HOME}/alimtalk-proxy/.env"
                else
                  gis_registry_cleanup_failed=1
                fi
              fi

              if [[ "${gis_registry_cleanup_failed}" -eq 0 ]]; then
                if [[ ! -f .env || -L .env ]] \
                  || [[ "$(stat -c '%u' .env)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' .env)" != "600" ]] \
                  || [[ "$(grep -Fxc "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" .env || true)" != "1" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' .env || true)" != "0" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_SHA256[[:space:]]*=' .env || true)" != "0" ]]; then
                  echo "CLEANUP_FAILED: GIS file-only runtime .env validation failed."
                  gis_registry_cleanup_failed=1
                fi
              fi

              gis_registry_marker_next=""
              if [[ "${gis_registry_cleanup_failed}" -eq 0 ]]; then
                if gis_registry_marker_next="$(
                  mktemp "${HOME}/alimtalk-proxy/.gis-mcp-file-registry-v1.next.XXXXXX"
                )" \
                  && chmod 600 "${gis_registry_marker_next}" \
                  && printf 'version=1\n' > "${gis_registry_marker_next}" \
                  && mv -f -- "${gis_registry_marker_next}" "${gis_registry_marker}"; then
                  gis_registry_marker_next=""
                else
                  echo "CLEANUP_FAILED: GIS MCP migration marker installation failed."
                  gis_registry_cleanup_failed=1
                fi
              fi
              if [[ "${gis_registry_cleanup_failed}" -eq 0 ]] \
                && { [[ ! -f "${gis_registry_marker}" ]] \
                  || [[ -L "${gis_registry_marker}" ]] \
                  || [[ "$(stat -c '%u' "${gis_registry_marker}")" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_registry_marker}")" != "600" ]] \
                  || [[ "$(<"${gis_registry_marker}")" != "version=1" ]]; }; then
                echo "CLEANUP_FAILED: GIS MCP migration marker validation failed."
                gis_registry_cleanup_failed=1
              fi

              if [[ "${gis_registry_cleanup_failed}" -eq 0 ]] \
                && [[ "${gis_initial_activation_handoff_required}" -eq 1 ]] \
                && ! consume_gis_initial_activation_handoff; then
                echo "CLEANUP_FAILED: GIS MCP activation handoff receipt could not be committed."
                gis_registry_cleanup_failed=1
              fi

              if [[ -n "${gis_registry_marker_next}" ]]; then
                rm -f -- "${gis_registry_marker_next}" >/dev/null 2>&1 || true
              fi
              if [[ -n "${gis_registry_env_next}" ]]; then
                if ! rm -f -- "${gis_registry_env_next}" >/dev/null 2>&1 \
                  || [[ -e "${gis_registry_env_next}" || -L "${gis_registry_env_next}" ]]; then
                  gis_registry_cleanup_failed=1
                fi
                gis_registry_env_next=""
              fi

              if [[ "${gis_registry_cleanup_failed}" -ne 0 ]]; then
                echo "CLEANUP_FAILED: GIS file-mode container remains active; migration finalization requires review."
                exit 71
              fi
              echo "GIS MCP file-registry migration committed and legacy rollback removed."
            fi

            if [[ "${gis_registry_finalization_required}" -ne 1 ]] \
              && [[ "${gis_initial_activation_handoff_required}" -eq 1 ]] \
              && ! consume_gis_initial_activation_handoff; then
              echo "CLEANUP_FAILED: GIS MCP activation recovery receipt could not be committed."
              exit 71
            fi

            if [[ "${legal_registry_finalization_required}" -ne 1 ]] \
              && [[ "${gis_registry_finalization_required}" -ne 1 ]] \
              && [[ "${had_previous}" -eq 1 ]]; then
              echo "Previous container preserved as ${ROLLBACK_CONTAINER} for rollback."
            fi
            docker image prune -f || true

            deployment_phase="complete"
            echo "Deployment verified for git SHA ${EXPECTED_GIT_SHA} and digest ${EXPECTED_DIGEST}."
