name: Docker Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      land_area_sync_allowlist_sha256:
        description: '승인된 canonical LAND_AREA_SYNC allowlist SHA-256 (enabled=true일 때 필수)'
        required: false
        type: string
      land_area_sync_allowlist_count:
        description: '승인된 LAND_AREA_SYNC allowlist target 수 (enabled=true일 때 필수)'
        required: false
        type: string
      gis_mcp_activation_id:
        description: '승인된 GIS MCP 초기 활성화 ID (JSON bootstrap일 때 필수)'
        required: false
        type: string
      gis_mcp_token_commitment:
        description: '승인된 GIS MCP 초기 활성화 token commitment SHA-256 (JSON bootstrap일 때 필수)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tonghari-api-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/dlswn666/alimtalk-proxy

jobs:
  preflight:
    name: EC2 deployment preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main branch and EC2 connection secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
          GIS_MCP_ACTIVATION_ID: ${{ inputs.gis_mcp_activation_id || '' }}
          GIS_MCP_TOKEN_COMMITMENT: ${{ inputs.gis_mcp_token_commitment || '' }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must run from refs/heads/main (received ${GITHUB_REF})."
            exit 1
          fi

          missing=()
          for secret_name in \
            EC2_HOST \
            EC2_USERNAME \
            EC2_SSH_KEY \
            EC2_SSH_FINGERPRINT
          do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error::Missing required deployment secrets: ${missing_list%, }."
            exit 1
          fi

          if [[ -n "${GIS_MCP_ACTIVATION_ID}" || -n "${GIS_MCP_TOKEN_COMMITMENT}" ]]; then
            [[ "${DEPLOY_EVENT_NAME}" == "workflow_dispatch" ]] \
              || { echo "::error::GIS MCP initial activation requires workflow_dispatch."; exit 1; }
            [[ "${DEPLOY_RUN_ATTEMPT}" == "1" ]] \
              || { echo "::error::GIS MCP initial activation cannot run from a re-run attempt."; exit 1; }
            [[ "${#GIS_MCP_ACTIVATION_ID}" -ge 8 \
              && "${#GIS_MCP_ACTIVATION_ID}" -le 64 \
              && "${GIS_MCP_ACTIVATION_ID}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] \
              || { echo "::error::Invalid GIS MCP activation ID."; exit 1; }
            [[ "${GIS_MCP_TOKEN_COMMITMENT}" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::Invalid GIS MCP token commitment."; exit 1; }
          fi

  gis-mcp-activation-approval:
    name: Approve GIS MCP initial activation
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.gis_mcp_activation_id != '' || inputs.gis_mcp_token_commitment != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gis-mcp-registry
    permissions:
      contents: read
    steps:
      - name: Confirm protected activation approval
        shell: bash
        run: echo "Protected GIS MCP initial activation approval granted."

  quality-gates:
    name: Tests, TypeScript and writer guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Verify property-building writer boundary
        run: node scripts/check-property-building-link-writers.mjs

  build-and-push:
    name: Build immutable image
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Prepare immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        # docker/login-action v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        # docker/build-push-action v5
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            IMAGE_TAG=${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require pushed image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker build did not return a valid immutable digest."
            exit 1
          fi
          echo "Pushed immutable image digest ${IMAGE_DIGEST}."

  deploy:
    name: Deploy and verify exact revision
    needs: [preflight, build-and-push, gis-mcp-activation-approval]
    if: >-
      always() &&
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build-and-push.result == 'success' &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.gis_mcp_activation_id != '' || inputs.gis_mcp_token_commitment != '') &&
          needs.gis-mcp-activation-approval.result == 'success'
        ) ||
        (
          !(github.event_name == 'workflow_dispatch' &&
            (inputs.gis_mcp_activation_id != '' || inputs.gis_mcp_token_commitment != '')) &&
          needs.gis-mcp-activation-approval.result == 'skipped'
        )
      )
    runs-on: ubuntu-latest
    # production lock 40분 + operation lock 45분 + 실제 배포/rollback 30분을
    # 모두 command/job 취소 전에 완료하고 후처리 여유를 남긴다.
    timeout-minutes: 130
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy immutable image to EC2
        # appleboy/ssh-action v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ALLOWLIST_DIGEST: ${{ inputs.land_area_sync_allowlist_sha256 || '' }}
          EXPECTED_ALLOWLIST_COUNT: ${{ inputs.land_area_sync_allowlist_count || '' }}
          EXPECTED_GIS_MCP_ACTIVATION_ID: ${{ inputs.gis_mcp_activation_id || '' }}
          EXPECTED_GIS_MCP_TOKEN_COMMITMENT: ${{ inputs.gis_mcp_token_commitment || '' }}
          DEPLOY_IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_GIT_SHA: ${{ github.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          DEPLOY_BUILD_TIME: ${{ needs.build-and-push.outputs.build_time }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 120m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_EVENT_NAME,DEPLOY_RUN_ATTEMPT,EXPECTED_ALLOWLIST_DIGEST,EXPECTED_ALLOWLIST_COUNT,EXPECTED_GIS_MCP_ACTIVATION_ID,EXPECTED_GIS_MCP_TOKEN_COMMITMENT,DEPLOY_IMAGE_REPOSITORY,DEPLOY_GIT_SHA,DEPLOY_IMAGE_DIGEST,DEPLOY_BUILD_TIME
          script: |
            set -Eeuo pipefail

            cd "$HOME/alimtalk-proxy"

            production_lock_path="${HOME}/alimtalk-proxy/.tonghari-api-production.lock"
            operation_lock_path="${HOME}/alimtalk-proxy/.land-area-sync-operation.lock"
            if [[ ! -e "${production_lock_path}" && ! -L "${production_lock_path}" ]]; then
              (
                umask 077
                set -o noclobber
                : > "${production_lock_path}"
              ) 2>/dev/null || true
            fi
            if [[ ! -f "${production_lock_path}" || -L "${production_lock_path}" ]] \
              || [[ "$(stat -c '%u' "${production_lock_path}")" != "$(id -u)" ]] \
              || [[ "$(stat -c '%a' "${production_lock_path}")" != "600" ]]; then
              echo "Shared production lock must be a deploy-user-owned regular mode 600 file."
              false
            fi
            exec 9>>"${production_lock_path}"
            if ! flock -w 2400 9; then
              echo "Timed out waiting for the shared production deployment lock."
              false
            fi

            if [[ ! -e "${operation_lock_path}" && ! -L "${operation_lock_path}" ]]; then
              (
                umask 077
                set -o noclobber
                : > "${operation_lock_path}"
              ) 2>/dev/null || true
            fi
            if [[ ! -f "${operation_lock_path}" || -L "${operation_lock_path}" ]] \
              || [[ "$(stat -c '%u' "${operation_lock_path}")" != "$(id -u)" ]] \
              || [[ "$(stat -c '%a' "${operation_lock_path}")" != "600" ]]; then
              echo "Land-area operation lock must be a deploy-user-owned regular mode 600 file."
              false
            fi
            exec 8>>"${operation_lock_path}"
            if ! flock -w 2700 8; then
              echo "Timed out waiting for the bounded land-area operation lock."
              false
            fi

            IMAGE_REPOSITORY="${DEPLOY_IMAGE_REPOSITORY}"
            IMAGE_TAG="${IMAGE_REPOSITORY}:${DEPLOY_GIT_SHA}"
            EXPECTED_DIGEST="${DEPLOY_IMAGE_DIGEST}"
            IMAGE="${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
            EXPECTED_GIT_SHA="${DEPLOY_GIT_SHA}"
            EXPECTED_BUILD_TIME="${DEPLOY_BUILD_TIME}"
            EXPECTED_IMAGE_TAG="${IMAGE_TAG}"
            CONTAINER_NAME="alimtalk-proxy"
            CANDIDATE_CONTAINER="${CONTAINER_NAME}-candidate"
            ROLLBACK_CONTAINER="${CONTAINER_NAME}-rollback"
            had_previous=0
            new_container_attempted=0
            candidate_started=0
            registry_logged_in=0
            previous_image_id=""
            legal_registry_host_dir="${HOME}/alimtalk-proxy/.legal-mcp-secrets"
            legal_registry_container_dir="/run/secrets/tonghari-legal-mcp"
            legal_registry_container_file="${legal_registry_container_dir}/clients.json"
            legal_registry_marker="${HOME}/alimtalk-proxy/.legal-mcp-file-registry-v1"
            legal_registry_env_next=""
            legal_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
            legal_registry_client_count=""
            legal_registry_required_at_start=0
            legal_registry_finalization_required=0
            legal_registry_needs_next_env=0
            legal_registry_json_source_at_start=0
            gis_registry_host_dir="${HOME}/alimtalk-proxy/.gis-mcp-secrets"
            gis_registry_container_dir="/run/secrets/tonghari-gis-mcp"
            gis_registry_container_file="${gis_registry_container_dir}/clients.json"
            gis_registry_marker="${HOME}/alimtalk-proxy/.gis-mcp-file-registry-v1"
            gis_registry_env_next=""
            gis_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
            gis_registry_client_count=""
            gis_registry_active_for_deployment=0
            gis_registry_required_at_start=0
            gis_registry_finalization_required=0
            gis_registry_needs_next_env=0
            gis_registry_json_source_at_start=0
            gis_initial_activation_handoff_required=0
            gis_initial_activation_recovery_required=0
            gis_initial_activation_binding_sha_drift=0
            gis_initial_activation_historical_finalization_required=0
            gis_initial_activation_running_file_mode_at_start=0
            gis_initial_activation_prepared_path="${HOME}/alimtalk-proxy/.gis-mcp-initial-activation-prepared-v1"
            gis_initial_activation_receipts_dir="${HOME}/alimtalk-proxy/.gis-mcp-initial-activation-receipts"
            gis_initial_activation_receipt_path=""
            gis_initial_activation_client_id=""
            gis_initial_activation_registry_dir_created=0
            gis_initial_activation_registry_dir_identity=""
            gis_initial_activation_registry_cleanup_armed=0
            deployment_runtime_env="${HOME}/alimtalk-proxy/.env"
            deployment_phase="precommit"

            for variable_name in \
              GHCR_USERNAME \
              GHCR_TOKEN \
              DEPLOY_EVENT_NAME \
              DEPLOY_RUN_ATTEMPT \
              DEPLOY_IMAGE_REPOSITORY \
              DEPLOY_GIT_SHA \
              DEPLOY_IMAGE_DIGEST \
              DEPLOY_BUILD_TIME
            do
              if [[ -z "${!variable_name:-}" ]]; then
                echo "Required deployment variable ${variable_name} was not transferred to EC2."
                false
              fi
            done

            if [[ ! -f .env || -L .env ]]; then
              echo "Runtime .env must exist as a regular, non-symlink file on EC2."
              false
            fi

            validate_gis_initial_activation_dispatch() {
              if [[ "${DEPLOY_EVENT_NAME}" != "workflow_dispatch" ]]; then
                echo "GIS MCP initial activation requires an explicit workflow_dispatch."
                return 1
              fi
              if [[ "${DEPLOY_RUN_ATTEMPT}" != "1" ]]; then
                echo "GIS MCP initial activation cannot run from a re-run attempt."
                return 1
              fi
              if [[ "${#EXPECTED_GIS_MCP_ACTIVATION_ID}" -lt 8 \
                || "${#EXPECTED_GIS_MCP_ACTIVATION_ID}" -gt 64 \
                || ! "${EXPECTED_GIS_MCP_ACTIVATION_ID}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
                echo "GIS MCP initial activation requires a valid activation ID."
                return 1
              fi
              if [[ ! "${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "GIS MCP initial activation requires a valid token commitment."
                return 1
              fi
            }

            load_gis_initial_activation_binding() {
              local binding_path="$1"
              local require_runtime_env_match="$2"
              local require_current_git_sha="$3"
              local actual_runtime_env_sha256=""
              local -a binding_lines=()

              if [[ "${require_runtime_env_match}" != "0" \
                && "${require_runtime_env_match}" != "1" ]] \
                || [[ "${require_current_git_sha}" != "0" \
                  && "${require_current_git_sha}" != "1" ]]; then
                echo "GIS MCP initial activation binding policy is invalid."
                return 1
              fi

              if [[ ! -f "${binding_path}" || -L "${binding_path}" ]] \
                || [[ "$(stat -c '%u' "${binding_path}" 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${binding_path}" 2>/dev/null)" != "600" ]]; then
                echo "GIS MCP initial activation binding is missing or insecure."
                return 1
              fi
              mapfile -t binding_lines < "${binding_path}"
              if [[ "${#binding_lines[@]}" != "6" ]] \
                || [[ "${binding_lines[0]:-}" != "version=1" ]] \
                || [[ ! "${binding_lines[1]:-}" =~ ^activationId=([a-z0-9]+(-[a-z0-9]+)*)$ ]] \
                || [[ ! "${binding_lines[2]:-}" =~ ^clientId=([a-z0-9]+(-[a-z0-9]+)*)$ ]] \
                || [[ ! "${binding_lines[3]:-}" =~ ^gitSha=([0-9a-f]{40})$ ]] \
                || [[ ! "${binding_lines[4]:-}" =~ ^runtimeEnvSha256=([0-9a-f]{64})$ ]] \
                || [[ ! "${binding_lines[5]:-}" =~ ^tokenCommitment=([0-9a-f]{64})$ ]]; then
                echo "GIS MCP initial activation binding has an invalid schema."
                return 1
              fi

              gis_initial_activation_prepared_id="${binding_lines[1]#activationId=}"
              gis_initial_activation_client_id="${binding_lines[2]#clientId=}"
              gis_initial_activation_prepared_git_sha="${binding_lines[3]#gitSha=}"
              gis_initial_activation_prepared_env_sha256="${binding_lines[4]#runtimeEnvSha256=}"
              gis_initial_activation_prepared_commitment="${binding_lines[5]#tokenCommitment=}"
              if [[ "${#gis_initial_activation_prepared_id}" -lt 8 \
                || "${#gis_initial_activation_prepared_id}" -gt 64 \
                || "${#gis_initial_activation_client_id}" -gt 64 ]] \
                || [[ "${gis_initial_activation_prepared_id}" != "${EXPECTED_GIS_MCP_ACTIVATION_ID}" ]] \
                || { [[ "${require_current_git_sha}" == "1" ]] \
                  && [[ "${gis_initial_activation_prepared_git_sha}" != "${DEPLOY_GIT_SHA}" ]]; } \
                || [[ "${gis_initial_activation_prepared_commitment}" != "${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
                echo "GIS MCP initial activation dispatch does not match its durable binding."
                return 1
              fi
              if [[ "${require_runtime_env_match}" == "1" ]]; then
                actual_runtime_env_sha256="$(sha256sum -- .env | awk '{print $1}')"
                if [[ "${gis_initial_activation_prepared_env_sha256}" \
                  != "${actual_runtime_env_sha256}" ]]; then
                  echo "GIS MCP initial activation runtime environment does not match its durable binding."
                  return 1
                fi
              fi
              actual_runtime_env_sha256=""
            }

            env_owner="$(stat -c '%U' .env)"
            env_mode="$(stat -c '%a' .env)"
            if [[ "${env_owner}" != "$(id -un)" || "${env_mode}" != "600" ]]; then
              echo "Runtime .env must be owned by the deploy user with mode 600."
              false
            fi

            legal_registry_file_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_FILE[[:space:]]*=' \
                .env || true
            )"
            legal_registry_json_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' \
                .env || true
            )"
            legal_registry_legacy_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=' \
                .env || true
            )"
            for definition_count in \
              "${legal_registry_file_definition_count}" \
              "${legal_registry_json_definition_count}" \
              "${legal_registry_legacy_definition_count}"
            do
              if [[ "${definition_count}" -gt 1 ]]; then
                echo "Runtime .env has duplicate legal MCP authentication keys."
                false
              fi
            done

            legal_registry_file_exact_count="$(
              grep -Fxc \
                "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" \
                .env || true
            )"
            legal_registry_file_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_FILE=.+$' .env || true
            )"
            legal_registry_json_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_JSON=.+$' .env || true
            )"
            legal_registry_legacy_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_SHA256=.+$' .env || true
            )"

            legal_registry_marker_present=0
            if [[ -e "${legal_registry_marker}" || -L "${legal_registry_marker}" ]]; then
              if [[ ! -f "${legal_registry_marker}" || -L "${legal_registry_marker}" ]] \
                || [[ "$(stat -c '%u' "${legal_registry_marker}")" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_marker}")" != "600" ]] \
                || [[ "$(<"${legal_registry_marker}")" != "version=1" ]]; then
                echo "Legal MCP file-registry marker is invalid."
                false
              fi
              legal_registry_marker_present=1
              legal_registry_required_at_start=1
              if [[ "${legal_registry_file_definition_count}" != "1" ]] \
                || [[ "${legal_registry_file_exact_count}" != "1" ]] \
                || [[ "${legal_registry_json_definition_count}" != "0" ]] \
                || [[ "${legal_registry_legacy_definition_count}" != "0" ]]; then
                echo "Migrated runtime .env must use only the fixed legal MCP registry file."
                false
              fi
            else
              legal_registry_finalization_required=1
              if [[ "${legal_registry_file_exact_count}" == "1" ]] \
                && [[ "${legal_registry_json_nonempty_count}" == "0" ]] \
                && [[ "${legal_registry_legacy_nonempty_count}" == "0" ]]; then
                # final health 통과 후 cleanup이 끊긴 경우를 안전하게 마감한다.
                legal_registry_required_at_start=1
                if [[ "${legal_registry_json_definition_count}" != "0" ]] \
                  || [[ "${legal_registry_legacy_definition_count}" != "0" ]]; then
                  legal_registry_needs_next_env=1
                fi
              elif [[ "${legal_registry_json_definition_count}" == "1" ]] \
                && [[ "${legal_registry_json_nonempty_count}" == "1" ]] \
                && [[ "${legal_registry_file_nonempty_count}" == "0" ]] \
                && [[ "${legal_registry_legacy_nonempty_count}" == "0" ]]; then
                # 최초 1회만 EC2의 기존 JSON registry를 file로 이전한다.
                legal_registry_needs_next_env=1
                legal_registry_json_source_at_start=1
              else
                echo "Pre-migration runtime .env must contain one non-empty legal MCP JSON registry."
                false
              fi
            fi

            shopt -s nullglob
            legal_registry_orphan_next_envs=(
              "${HOME}/alimtalk-proxy"/.env.legal-mcp.next.*
            )
            shopt -u nullglob
            if (( ${#legal_registry_orphan_next_envs[@]} > 0 )); then
              echo "CLEANUP_FAILED: orphan legal MCP next env requires manual review."
              false
            fi

            gis_registry_file_definition_count="$(
              grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_FILE[[:space:]]*=' \
                .env || true
            )"
            gis_registry_json_definition_count="$(
              grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' \
                .env || true
            )"
            gis_registry_legacy_definition_count="$(
              grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_SHA256[[:space:]]*=' \
                .env || true
            )"
            for definition_count in \
              "${gis_registry_file_definition_count}" \
              "${gis_registry_json_definition_count}" \
              "${gis_registry_legacy_definition_count}"
            do
              if [[ "${definition_count}" -gt 1 ]]; then
                echo "Runtime .env has duplicate GIS MCP authentication keys."
                false
              fi
            done

            gis_registry_file_exact_count="$(
              grep -Fxc \
                "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" \
                .env || true
            )"
            gis_registry_file_nonempty_count="$(
              grep -Ec '^GIS_MCP_TOKEN_REGISTRY_FILE=.+$' .env || true
            )"
            gis_registry_json_nonempty_count="$(
              grep -Ec '^GIS_MCP_TOKEN_REGISTRY_JSON=.+$' .env || true
            )"
            gis_registry_legacy_nonempty_count="$(
              grep -Ec '^GIS_MCP_TOKEN_SHA256=.+$' .env || true
            )"

            gis_initial_activation_running_environment=""
            gis_initial_activation_running_mount=""
            if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && [[ "$(docker container inspect --format '{{.State.Running}}' "${CONTAINER_NAME}")" == "true" ]]; then
              gis_initial_activation_running_environment="$(
                docker container inspect \
                  --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "${CONTAINER_NAME}"
              )"
              gis_initial_activation_running_mount="$(
                docker container inspect --format \
                  '{{range .Mounts}}{{if eq .Destination "/run/secrets/tonghari-gis-mcp"}}{{.Type}}|{{.RW}}|{{.Source}}{{println}}{{end}}{{end}}' \
                  "${CONTAINER_NAME}"
              )"
              if [[ "$(grep -Fxc "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" <<< "${gis_initial_activation_running_environment}" || true)" == "1" ]] \
                && [[ "$(grep -Ec '^GIS_MCP_TOKEN_REGISTRY_JSON=' <<< "${gis_initial_activation_running_environment}" || true)" == "0" ]] \
                && [[ "$(grep -Ec '^GIS_MCP_TOKEN_SHA256=' <<< "${gis_initial_activation_running_environment}" || true)" == "0" ]] \
                && [[ "${gis_initial_activation_running_mount}" == "bind|false|${gis_registry_host_dir}" ]]; then
                gis_initial_activation_running_file_mode_at_start=1
              fi
            fi
            gis_initial_activation_running_environment=""
            gis_initial_activation_running_mount=""

            gis_registry_marker_present=0
            if [[ -e "${gis_registry_marker}" || -L "${gis_registry_marker}" ]]; then
              if [[ ! -f "${gis_registry_marker}" || -L "${gis_registry_marker}" ]] \
                || [[ "$(stat -c '%u' "${gis_registry_marker}")" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${gis_registry_marker}")" != "600" ]] \
                || [[ "$(<"${gis_registry_marker}")" != "version=1" ]]; then
                echo "GIS MCP file-registry marker is invalid."
                false
              fi
              gis_registry_marker_present=1
              gis_registry_active_for_deployment=1
              gis_registry_required_at_start=1
              if [[ "${gis_registry_file_definition_count}" != "1" ]] \
                || [[ "${gis_registry_file_exact_count}" != "1" ]] \
                || [[ "${gis_registry_json_definition_count}" != "0" ]] \
                || [[ "${gis_registry_legacy_definition_count}" != "0" ]]; then
                echo "Migrated runtime .env must use only the fixed GIS MCP registry file."
                false
              fi
            else
              if [[ "${gis_registry_file_exact_count}" == "1" ]] \
                && [[ "${gis_registry_json_nonempty_count}" == "0" ]] \
                && [[ "${gis_registry_legacy_nonempty_count}" == "0" ]]; then
                # final health 통과 후 cleanup이 끊긴 경우를 안전하게 마감한다.
                gis_registry_active_for_deployment=1
                gis_registry_finalization_required=1
                gis_registry_required_at_start=1
                if [[ "${gis_registry_json_definition_count}" != "0" ]] \
                  || [[ "${gis_registry_legacy_definition_count}" != "0" ]]; then
                  gis_registry_needs_next_env=1
                fi
              elif [[ "${gis_registry_json_definition_count}" == "1" ]] \
                && [[ "${gis_registry_json_nonempty_count}" == "1" ]] \
                && [[ "${gis_registry_file_nonempty_count}" == "0" ]] \
                && [[ "${gis_registry_legacy_nonempty_count}" == "0" ]]; then
                # 최초 1회만 EC2의 기존 JSON registry를 file로 이전한다.
                if [[ "${legal_registry_marker_present}" -ne 1 ]] \
                  || [[ "${legal_registry_required_at_start}" -ne 1 ]] \
                  || [[ "${legal_registry_finalization_required}" -ne 0 ]] \
                  || [[ "${legal_registry_needs_next_env}" -ne 0 ]] \
                  || [[ "${legal_registry_json_source_at_start}" -ne 0 ]]; then
                  echo "GIS MCP initial activation requires committed legal file-registry mode."
                  false
                fi
                validate_gis_initial_activation_dispatch
                gis_initial_activation_require_current_git_sha=1
                if [[ "${gis_initial_activation_running_file_mode_at_start}" -eq 1 ]]; then
                  # 이전 run의 final health 이후 끊긴 경우만 과거 binding을 읽는다.
                  gis_initial_activation_require_current_git_sha=0
                fi
                load_gis_initial_activation_binding \
                  "${gis_initial_activation_prepared_path}" 1 \
                  "${gis_initial_activation_require_current_git_sha}"
                if [[ "${gis_initial_activation_prepared_git_sha}" != "${DEPLOY_GIT_SHA}" ]]; then
                  if [[ "${gis_initial_activation_running_file_mode_at_start}" -ne 1 ]]; then
                    echo "GIS MCP JSON bootstrap requires the current deployment SHA."
                    false
                  fi
                  gis_initial_activation_binding_sha_drift=1
                  gis_initial_activation_historical_finalization_required=1
                  gis_initial_activation_recovery_required=1
                fi
                if [[ -e "${gis_initial_activation_receipts_dir}" \
                  || -L "${gis_initial_activation_receipts_dir}" ]]; then
                  if [[ ! -d "${gis_initial_activation_receipts_dir}" \
                    || -L "${gis_initial_activation_receipts_dir}" ]] \
                    || [[ "$(stat -c '%u' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "$(id -u)" ]] \
                    || [[ "$(stat -c '%a' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "700" ]]; then
                    echo "GIS MCP initial activation receipts directory is insecure."
                    false
                  fi
                  gis_initial_activation_receipt_path="${gis_initial_activation_receipts_dir}/${gis_initial_activation_prepared_id}"
                  if [[ -e "${gis_initial_activation_receipt_path}" \
                    || -L "${gis_initial_activation_receipt_path}" ]]; then
                    echo "GIS MCP initial activation ID has already been consumed."
                    false
                  fi
                fi
                gis_initial_activation_handoff_required=1
                gis_registry_active_for_deployment=1
                gis_registry_finalization_required=1
                gis_registry_needs_next_env=1
                gis_registry_json_source_at_start=1
              elif [[ "${gis_registry_file_definition_count}" == "0" ]] \
                && [[ "${gis_registry_json_definition_count}" == "0" ]] \
                && [[ "${gis_registry_legacy_definition_count}" == "0" ]]; then
                # GIS MCP가 아직 활성화되지 않은 기존 운영 배포를 유지한다.
                # JSON bootstrap이 추가되면 위 분기가 file migration을 강제한다.
                gis_registry_active_for_deployment=0
              else
                echo "GIS MCP authentication must be fully unset or use one supported registry source."
                false
              fi
            fi

            gis_initial_activation_prepared_present=0
            if [[ -e "${gis_initial_activation_prepared_path}" \
              || -L "${gis_initial_activation_prepared_path}" ]]; then
              gis_initial_activation_prepared_present=1
            fi
            if [[ "${gis_registry_json_source_at_start}" -ne 1 ]] \
              && [[ "${gis_registry_active_for_deployment}" -eq 1 ]] \
              && { [[ "${gis_initial_activation_prepared_present}" -eq 1 ]] \
                || [[ -n "${EXPECTED_GIS_MCP_ACTIVATION_ID}" ]] \
                || [[ -n "${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; }; then
              # file-mode/marker commit 뒤 receipt rename 전에 끊긴 activation만
              # 같은 dispatch binding으로 멱등 완결한다.
              validate_gis_initial_activation_dispatch
              gis_initial_activation_require_current_git_sha=1
              if [[ "${gis_registry_marker_present}" -eq 1 ]] \
                || [[ "${gis_initial_activation_running_file_mode_at_start}" -eq 1 ]]; then
                # marker 완료 또는 이전 run의 running file-mode commit만 과거 SHA를 허용한다.
                gis_initial_activation_require_current_git_sha=0
              fi
              if [[ "${gis_initial_activation_prepared_present}" -eq 1 ]]; then
                load_gis_initial_activation_binding \
                  "${gis_initial_activation_prepared_path}" 0 \
                  "${gis_initial_activation_require_current_git_sha}"
                gis_initial_activation_receipt_path="${gis_initial_activation_receipts_dir}/${EXPECTED_GIS_MCP_ACTIVATION_ID}"
                if [[ -e "${gis_initial_activation_receipts_dir}" \
                  || -L "${gis_initial_activation_receipts_dir}" ]]; then
                  if [[ ! -d "${gis_initial_activation_receipts_dir}" \
                    || -L "${gis_initial_activation_receipts_dir}" ]] \
                    || [[ "$(stat -c '%u' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "$(id -u)" ]] \
                    || [[ "$(stat -c '%a' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "700" ]] \
                    || [[ -e "${gis_initial_activation_receipt_path}" \
                      || -L "${gis_initial_activation_receipt_path}" ]]; then
                    echo "GIS MCP recovery receipt state conflicts with the prepared binding."
                    false
                  fi
                fi
              else
                if [[ "${gis_registry_marker_present}" -ne 1 ]]; then
                  echo "GIS MCP recovery receipt requires the committed file-registry marker."
                  false
                fi
                if [[ ! -d "${gis_initial_activation_receipts_dir}" \
                  || -L "${gis_initial_activation_receipts_dir}" ]] \
                  || [[ "$(stat -c '%u' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "700" ]]; then
                  echo "GIS MCP recovery receipt directory is missing or insecure."
                  false
                fi
                gis_initial_activation_receipt_path="${gis_initial_activation_receipts_dir}/${EXPECTED_GIS_MCP_ACTIVATION_ID}"
                load_gis_initial_activation_binding \
                  "${gis_initial_activation_receipt_path}" 0 0
              fi
              if [[ "${gis_initial_activation_prepared_git_sha}" != "${DEPLOY_GIT_SHA}" ]]; then
                if [[ "${gis_registry_marker_present}" -ne 1 ]] \
                  && [[ "${gis_initial_activation_running_file_mode_at_start}" -ne 1 ]]; then
                  echo "GIS MCP activation SHA drift requires a committed running file-mode container."
                  false
                fi
                gis_initial_activation_binding_sha_drift=1
                if [[ "${gis_registry_marker_present}" -ne 1 ]]; then
                  gis_initial_activation_historical_finalization_required=1
                fi
              fi
              gis_initial_activation_handoff_required=1
              gis_initial_activation_recovery_required=1
            elif [[ "${gis_registry_json_source_at_start}" -ne 1 ]] \
              && [[ "${gis_initial_activation_prepared_present}" -eq 1 ]]; then
              echo "GIS MCP prepared activation cannot be consumed outside active file mode."
              false
            fi

            if [[ "${gis_registry_json_source_at_start}" -ne 1 ]] \
              && [[ "${gis_initial_activation_recovery_required}" -ne 1 ]] \
              && [[ -n "${EXPECTED_GIS_MCP_ACTIVATION_ID}" \
                || -n "${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
              echo "GIS MCP activation inputs are allowed only for a staged JSON bootstrap."
              false
            fi

            shopt -s nullglob
            gis_registry_orphan_next_envs=(
              "${HOME}/alimtalk-proxy"/.env.gis-mcp.next.*
            )
            shopt -u nullglob
            if (( ${#gis_registry_orphan_next_envs[@]} > 0 )); then
              if [[ "${#gis_registry_orphan_next_envs[@]}" -ne 1 ]] \
                || [[ "${gis_initial_activation_handoff_required}" -ne 1 ]] \
                || [[ "${gis_registry_json_source_at_start}" -ne 1 ]] \
                || [[ "${gis_registry_needs_next_env}" -ne 1 ]]; then
                echo "CLEANUP_FAILED: orphan GIS MCP next env requires manual review."
                false
              fi
              gis_registry_orphan_next_env="${gis_registry_orphan_next_envs[0]}"
              gis_registry_orphan_next_env_identity="$(
                stat -c '%d:%i' "${gis_registry_orphan_next_env}" 2>/dev/null
              )"
              gis_registry_orphan_next_env_sha256="$(
                sha256sum -- "${gis_registry_orphan_next_env}" 2>/dev/null \
                  | awk '{print $1}'
              )"
              if [[ -z "${gis_registry_orphan_next_env_identity}" ]] \
                || [[ ! "${gis_registry_orphan_next_env_sha256}" =~ ^[0-9a-f]{64}$ ]] \
                || [[ ! -f "${gis_registry_orphan_next_env}" ]] \
                || [[ -L "${gis_registry_orphan_next_env}" ]] \
                || [[ "$(stat -c '%u' "${gis_registry_orphan_next_env}" 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%g' "${gis_registry_orphan_next_env}" 2>/dev/null)" != "$(id -g)" ]] \
                || [[ "$(stat -c '%a' "${gis_registry_orphan_next_env}" 2>/dev/null)" != "600" ]] \
                || [[ "$(stat -c '%h' "${gis_registry_orphan_next_env}" 2>/dev/null)" != "1" ]]; then
                echo "CLEANUP_FAILED: staged GIS MCP next env is insecure."
                false
              fi
              export GIS_REGISTRY_CONTAINER_FILE="${gis_registry_container_file}"
              if ! awk '
                /^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_FILE[[:space:]]*=/ { next }
                /^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=/ { next }
                /^[[:space:]]*GIS_MCP_TOKEN_SHA256[[:space:]]*=/ { next }
                { print }
                END {
                  print "GIS_MCP_TOKEN_REGISTRY_FILE=" \
                    ENVIRON["GIS_REGISTRY_CONTAINER_FILE"]
                }
              ' .env | cmp -s - "${gis_registry_orphan_next_env}"; then
                unset GIS_REGISTRY_CONTAINER_FILE
                echo "CLEANUP_FAILED: staged GIS MCP next env does not match the current runtime environment."
                false
              fi
              unset GIS_REGISTRY_CONTAINER_FILE
              if [[ "$(stat -c '%d:%i' "${gis_registry_orphan_next_env}" 2>/dev/null)" \
                != "${gis_registry_orphan_next_env_identity}" ]] \
                || [[ "$(sha256sum -- "${gis_registry_orphan_next_env}" 2>/dev/null | awk '{print $1}')" \
                  != "${gis_registry_orphan_next_env_sha256}" ]] \
                || ! rm -f -- "${gis_registry_orphan_next_env}" \
                || [[ -e "${gis_registry_orphan_next_env}" \
                  || -L "${gis_registry_orphan_next_env}" ]]; then
                echo "CLEANUP_FAILED: staged GIS MCP next env could not be retired."
                false
              fi
              sync -f "${HOME}/alimtalk-proxy" || false
              gis_registry_orphan_next_env=""
              gis_registry_orphan_next_env_identity=""
              gis_registry_orphan_next_env_sha256=""
              gis_registry_orphan_next_envs=()
            fi
            if ! docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
              echo "RECOVERY_REQUIRED: current container is missing while rollback exists; it will not be started automatically."
              false
            fi
            if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && [[ "$(docker container inspect --format '{{.State.Running}}' "${CONTAINER_NAME}")" != "true" ]]; then
              echo "RECOVERY_REQUIRED: an existing current container must be running before deployment."
              false
            fi

            for variable_name in \
              DEV_API_JWT_SECRET \
              DEV_SUPABASE_URL \
              DEV_SUPABASE_SERVICE_ROLE_KEY
            do
              definition_count="$(grep -c "^${variable_name}=" .env || true)"
              if [[ "${definition_count}" != "1" ]] \
                || ! grep -Eq "^${variable_name}=.+" .env; then
                echo "Runtime .env must contain exactly one non-empty ${variable_name} entry."
                false
              fi
            done

            operation_target_count="$(grep -c '^BUILDING_WRITE_OPERATION_TARGETS=' .env || true)"
            if [[ "${operation_target_count}" != "1" ]]; then
              echo "Runtime .env must contain exactly one BUILDING_WRITE_OPERATION_TARGETS entry."
              false
            fi
            if ! grep -qx 'BUILDING_WRITE_OPERATION_TARGETS=development' .env; then
              echo "Runtime .env BUILDING_WRITE_OPERATION_TARGETS must be exactly development."
              false
            fi

            land_area_sync_flag_count="$(grep -Ec '^[[:space:]]*LAND_AREA_SYNC_ENABLED[[:space:]]*=' .env || true)"
            if [[ "${land_area_sync_flag_count}" -gt 1 ]]; then
              echo "Runtime .env may contain at most one LAND_AREA_SYNC_ENABLED entry."
              false
            fi
            expected_land_area_sync_enabled=false
            if [[ "${land_area_sync_flag_count}" -eq 1 ]]; then
              if grep -qx 'LAND_AREA_SYNC_ENABLED=true' .env; then
                expected_land_area_sync_enabled=true
              elif ! grep -qx 'LAND_AREA_SYNC_ENABLED=false' .env; then
                echo "Runtime .env LAND_AREA_SYNC_ENABLED must be exactly true or false."
                false
              fi
            fi

            allowed_targets_count="$(grep -c '^LAND_AREA_SYNC_ALLOWED_TARGETS=' .env || true)"
            if [[ "${allowed_targets_count}" -gt 1 ]]; then
              echo "Runtime .env may contain at most one LAND_AREA_SYNC_ALLOWED_TARGETS entry."
              false
            fi
            if [[ "${expected_land_area_sync_enabled}" == "true" ]]; then
              if [[ "${DEPLOY_EVENT_NAME}" != "workflow_dispatch" ]]; then
                echo "Enabled LAND_AREA_SYNC is allowed only for an explicit workflow_dispatch."
                false
              fi
              if [[ ! "${EXPECTED_ALLOWLIST_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Enabled LAND_AREA_SYNC requires an approved canonical allowlist SHA-256 input."
                false
              fi
              if [[ ! "${EXPECTED_ALLOWLIST_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                echo "Enabled LAND_AREA_SYNC requires a positive approved allowlist count input."
                false
              fi
              if [[ "${allowed_targets_count}" != "1" ]] \
                || ! grep -Eq '^LAND_AREA_SYNC_ALLOWED_TARGETS=.+$' .env; then
                echo "Enabled LAND_AREA_SYNC requires one non-empty allowlist."
                false
              fi

              allowed_targets_line="$(grep '^LAND_AREA_SYNC_ALLOWED_TARGETS=' .env)"
              allowed_targets_value="${allowed_targets_line#*=}"
              IFS=',' read -r -a allowed_target_entries <<< "${allowed_targets_value}"
              if [[ "${#allowed_target_entries[@]}" -eq 0 ]]; then
                echo "LAND_AREA_SYNC allowlist must contain at least one target."
                false
              fi
              for allowed_target_entry in "${allowed_target_entries[@]}"; do
                if [[ ! "${allowed_target_entry}" =~ ^development:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[0-9]{19}$ ]]; then
                  echo "Enabled LAND_AREA_SYNC permits only exact development:unionUuid:PNU entries."
                  false
                fi
              done
            elif [[ "${allowed_targets_count}" -eq 1 ]] \
              && ! grep -qx 'LAND_AREA_SYNC_ALLOWED_TARGETS=' .env; then
              echo "Disabled LAND_AREA_SYNC requires an empty allowlist."
              false
            fi

            logout_registry() {
              if [[ "${registry_logged_in}" -eq 1 ]]; then
                docker logout ghcr.io >/dev/null 2>&1 || true
                registry_logged_in=0
              fi
            }

            verify_status_ok() {
              local container_name="$1"
              local port="$2"

              for attempt in $(seq 1 15); do
                if curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${port}/health" \
                  | docker exec -i "${container_name}" node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          process.exit(JSON.parse(body).status === "ok" ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
                then
                  return 0
                fi
                sleep 2
              done

              return 1
            }

            verify_file_registry_container_contract() {
              local container_name="$1"
              local configured_environment=""
              local registry_mount=""

              configured_environment="$(
                docker container inspect \
                  --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "${container_name}"
              )" || return 1
              if [[ "$(grep -Fxc "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" <<< "${configured_environment}" || true)" != "1" ]] \
                || [[ "$(grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_JSON=' <<< "${configured_environment}" || true)" != "0" ]] \
                || [[ "$(grep -Ec '^LEGAL_MCP_TOKEN_SHA256=' <<< "${configured_environment}" || true)" != "0" ]]; then
                return 1
              fi

              registry_mount="$(
                docker container inspect --format \
                  '{{range .Mounts}}{{if eq .Destination "/run/secrets/tonghari-legal-mcp"}}{{.Type}}|{{.RW}}|{{.Source}}{{println}}{{end}}{{end}}' \
                  "${container_name}"
              )" || return 1
              [[ "${registry_mount}" == "bind|false|${legal_registry_host_dir}" ]]
            }

            verify_legal_registry_health() {
              local container_name="$1"
              local port="$2"

              curl -fsS --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" \
                | docker exec -i \
                    -e EXPECTED_LEGAL_MCP_CLIENT_COUNT="${legal_registry_client_count}" \
                    "${container_name}" \
                    node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          const health = JSON.parse(body);
                          const valid = health.features?.legalMcpConfigurationValid === true
                            && health.features?.legalMcpAuthMode === "client_registry"
                            && health.features?.legalMcpAuthSource === "file_registry"
                            && String(health.features?.legalMcpRegisteredClientCount)
                              === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT
                            && String(health.features?.legalMcpRegisteredTokenCount)
                              === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT;
                          process.exit(valid ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
            }

            verify_gis_file_registry_container_contract() {
              local container_name="$1"
              local configured_environment=""
              local registry_mount=""

              configured_environment="$(
                docker container inspect \
                  --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "${container_name}"
              )" || return 1
              if [[ "$(grep -Fxc "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" <<< "${configured_environment}" || true)" != "1" ]] \
                || [[ "$(grep -Ec '^GIS_MCP_TOKEN_REGISTRY_JSON=' <<< "${configured_environment}" || true)" != "0" ]] \
                || [[ "$(grep -Ec '^GIS_MCP_TOKEN_SHA256=' <<< "${configured_environment}" || true)" != "0" ]]; then
                return 1
              fi

              registry_mount="$(
                docker container inspect --format \
                  '{{range .Mounts}}{{if eq .Destination "/run/secrets/tonghari-gis-mcp"}}{{.Type}}|{{.RW}}|{{.Source}}{{println}}{{end}}{{end}}' \
                  "${container_name}"
              )" || return 1
              [[ "${registry_mount}" == "bind|false|${gis_registry_host_dir}" ]]
            }

            verify_gis_registry_health() {
              local container_name="$1"
              local port="$2"

              curl -fsS --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" \
                | docker exec -i \
                    -e EXPECTED_GIS_MCP_CLIENT_COUNT="${gis_registry_client_count}" \
                    "${container_name}" \
                    node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          const health = JSON.parse(body);
                          const valid = health.features?.gisMcpConfigurationValid === true
                            && health.features?.gisMcpAuthMode === "client_registry"
                            && health.features?.gisMcpAuthSource === "file_registry"
                            && health.features?.gisMcpProviderMode === "vworld_and_data_portal"
                            && String(health.features?.gisMcpRegisteredClientCount)
                              === process.env.EXPECTED_GIS_MCP_CLIENT_COUNT
                            && String(health.features?.gisMcpRegisteredTokenCount)
                              === process.env.EXPECTED_GIS_MCP_CLIENT_COUNT;
                          process.exit(valid ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
            }

            verify_gis_initial_activation_running_git_sha() {
              local container_name="$1"
              local port="$2"

              curl -fsS --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" \
                | docker exec -i \
                    -e EXPECTED_INITIAL_ACTIVATION_GIT_SHA="${gis_initial_activation_prepared_git_sha}" \
                    "${container_name}" \
                    node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          const health = JSON.parse(body);
                          const valid = health.status === "ok"
                            && health.gitSha
                              === process.env.EXPECTED_INITIAL_ACTIVATION_GIT_SHA;
                          process.exit(valid ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
            }

            attest_gis_registry_published_state() {
              docker run --rm \
                --network none \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                -e "GIS_REGISTRY_DIRECTORY=${gis_registry_container_dir}" \
                -e EXPECTED_REGISTRY_UID=1001 \
                -e EXPECTED_REGISTRY_GID=1001 \
                --mount \
                  "type=bind,src=${gis_registry_host_dir},dst=${gis_registry_container_dir},readonly" \
                "${IMAGE}" \
                node -e '
                  // GIS_REGISTRY_DIRECTORY_ATTESTATION_START
                  const fs = require("node:fs");
                  const dir = process.env.GIS_REGISTRY_DIRECTORY || "";
                  const expectedUid = Number(process.env.EXPECTED_REGISTRY_UID);
                  const expectedGid = Number(process.env.EXPECTED_REGISTRY_GID);
                  if (!dir || !Number.isSafeInteger(expectedUid)
                    || !Number.isSafeInteger(expectedGid)) {
                    process.exit(1);
                  }
                  let names;
                  try {
                    names = fs.readdirSync(dir);
                  } catch {
                    process.exit(1);
                  }
                  if (names.length !== 1 || names[0] !== "clients.json") {
                    process.exit(1);
                  }
                  let registry;
                  try {
                    registry = fs.lstatSync(`${dir}/clients.json`);
                  } catch {
                    process.exit(1);
                  }
                  const valid = registry.isFile()
                    && !registry.isSymbolicLink()
                    && registry.uid === expectedUid
                    && registry.gid === expectedGid
                    && (registry.mode & 0o7777) === 0o600
                    && registry.nlink === 1;
                  process.exit(valid ? 0 : 1);
                  // GIS_REGISTRY_DIRECTORY_ATTESTATION_END
                ' >/dev/null 2>&1
            }

            verify_gis_initial_activation_registry_attestation() {
              gis_initial_activation_registry_attestation="$(
                docker run --rm \
                  --network none \
                  --read-only \
                  --cap-drop ALL \
                  --security-opt no-new-privileges \
                  --mount \
                    "type=bind,src=${gis_registry_host_dir},dst=${gis_registry_container_dir},readonly" \
                  "${IMAGE}" \
                  node dist/cli/gis-mcp-registry.js attest-client \
                    --path "${gis_registry_container_file}" \
                    --client-id "${gis_initial_activation_client_id}" \
                    --operation-id "${EXPECTED_GIS_MCP_ACTIVATION_ID}"
              )" || return 1
              if [[ "${gis_initial_activation_registry_attestation}" != \
                "action=attest-client clientId=${gis_initial_activation_client_id} clientCount=${gis_registry_client_count} tokenCommitment=${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
                return 1
              fi
              gis_initial_activation_registry_attestation=""
            }

            consume_gis_initial_activation_handoff() {
              local -a prepared_lines=()

              [[ "${gis_initial_activation_handoff_required}" -eq 1 ]] || return 0
              [[ "${deployment_phase}" == "committed" ]] || return 1
              if [[ ! -f .env || -L .env ]] \
                || [[ "$(stat -c '%u' .env 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' .env 2>/dev/null)" != "600" ]] \
                || [[ "$(grep -Fxc "GIS_MCP_TOKEN_REGISTRY_FILE=${gis_registry_container_file}" .env || true)" != "1" ]] \
                || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' .env || true)" != "0" ]] \
                || [[ "$(grep -Ec '^[[:space:]]*GIS_MCP_TOKEN_SHA256[[:space:]]*=' .env || true)" != "0" ]] \
                || [[ ! -f "${gis_registry_marker}" || -L "${gis_registry_marker}" ]] \
                || [[ "$(stat -c '%u' "${gis_registry_marker}" 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${gis_registry_marker}" 2>/dev/null)" != "600" ]] \
                || [[ "$(<"${gis_registry_marker}")" != "version=1" ]]; then
                return 1
              fi

              gis_initial_activation_receipt_path="${gis_initial_activation_receipts_dir}/${EXPECTED_GIS_MCP_ACTIVATION_ID}"
              if [[ -e "${gis_initial_activation_receipts_dir}" \
                || -L "${gis_initial_activation_receipts_dir}" ]]; then
                if [[ ! -d "${gis_initial_activation_receipts_dir}" \
                  || -L "${gis_initial_activation_receipts_dir}" ]] \
                  || [[ "$(stat -c '%u' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "700" ]]; then
                  return 1
                fi
                if [[ -e "${gis_initial_activation_receipt_path}" \
                  || -L "${gis_initial_activation_receipt_path}" ]]; then
                  if [[ -e "${gis_initial_activation_prepared_path}" \
                    || -L "${gis_initial_activation_prepared_path}" ]] \
                    || [[ ! -f "${gis_initial_activation_receipt_path}" \
                      || -L "${gis_initial_activation_receipt_path}" ]] \
                    || [[ "$(stat -c '%u' "${gis_initial_activation_receipt_path}" 2>/dev/null)" != "$(id -u)" ]] \
                    || [[ "$(stat -c '%a' "${gis_initial_activation_receipt_path}" 2>/dev/null)" != "600" ]]; then
                    return 1
                  fi
                  mapfile -t prepared_lines < "${gis_initial_activation_receipt_path}"
                  if [[ "${#prepared_lines[@]}" != "6" ]] \
                    || [[ "${prepared_lines[0]:-}" != "version=1" ]] \
                    || [[ "${prepared_lines[1]:-}" != "activationId=${EXPECTED_GIS_MCP_ACTIVATION_ID}" ]] \
                    || [[ "${prepared_lines[2]:-}" != "clientId=${gis_initial_activation_client_id}" ]] \
                    || [[ "${prepared_lines[3]:-}" != "gitSha=${gis_initial_activation_prepared_git_sha}" ]] \
                    || [[ "${prepared_lines[4]:-}" != "runtimeEnvSha256=${gis_initial_activation_prepared_env_sha256}" ]] \
                    || [[ "${prepared_lines[5]:-}" != "tokenCommitment=${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
                    return 1
                  fi
                  if ! verify_gis_initial_activation_registry_attestation; then
                    return 1
                  fi
                  sync -f "${gis_initial_activation_receipt_path}" || return 1
                  sync -f "${gis_initial_activation_receipts_dir}" || return 1
                  return 0
                fi
              fi

              if [[ ! -f "${gis_initial_activation_prepared_path}" \
                || -L "${gis_initial_activation_prepared_path}" ]] \
                || [[ "$(stat -c '%u' "${gis_initial_activation_prepared_path}" 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${gis_initial_activation_prepared_path}" 2>/dev/null)" != "600" ]]; then
                return 1
              fi
              mapfile -t prepared_lines < "${gis_initial_activation_prepared_path}"
              if [[ "${#prepared_lines[@]}" != "6" ]] \
                || [[ "${prepared_lines[0]:-}" != "version=1" ]] \
                || [[ "${prepared_lines[1]:-}" != "activationId=${EXPECTED_GIS_MCP_ACTIVATION_ID}" ]] \
                || [[ "${prepared_lines[2]:-}" != "clientId=${gis_initial_activation_client_id}" ]] \
                || [[ "${prepared_lines[3]:-}" != "gitSha=${gis_initial_activation_prepared_git_sha}" ]] \
                || [[ "${prepared_lines[4]:-}" != "runtimeEnvSha256=${gis_initial_activation_prepared_env_sha256}" ]] \
                || [[ "${prepared_lines[5]:-}" != "tokenCommitment=${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
                return 1
              fi

              if ! verify_gis_initial_activation_registry_attestation; then
                return 1
              fi

              if [[ -e "${gis_initial_activation_receipts_dir}" \
                || -L "${gis_initial_activation_receipts_dir}" ]]; then
                if [[ ! -d "${gis_initial_activation_receipts_dir}" \
                  || -L "${gis_initial_activation_receipts_dir}" ]] \
                  || [[ "$(stat -c '%u' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_initial_activation_receipts_dir}" 2>/dev/null)" != "700" ]]; then
                  return 1
                fi
              else
                mkdir -m 700 -- "${gis_initial_activation_receipts_dir}" || return 1
                sync -f "${HOME}/alimtalk-proxy" || return 1
              fi
              if [[ -e "${gis_initial_activation_receipt_path}" \
                || -L "${gis_initial_activation_receipt_path}" ]]; then
                return 1
              fi
              mv -- "${gis_initial_activation_prepared_path}" \
                "${gis_initial_activation_receipt_path}" || return 1
              if [[ -e "${gis_initial_activation_prepared_path}" \
                || -L "${gis_initial_activation_prepared_path}" ]] \
                || [[ ! -f "${gis_initial_activation_receipt_path}" \
                  || -L "${gis_initial_activation_receipt_path}" ]] \
                || [[ "$(stat -c '%u' "${gis_initial_activation_receipt_path}" 2>/dev/null)" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${gis_initial_activation_receipt_path}" 2>/dev/null)" != "600" ]]; then
                return 1
              fi
              prepared_lines=()
              mapfile -t prepared_lines < "${gis_initial_activation_receipt_path}"
              if [[ "${#prepared_lines[@]}" != "6" ]] \
                || [[ "${prepared_lines[0]:-}" != "version=1" ]] \
                || [[ "${prepared_lines[1]:-}" != "activationId=${EXPECTED_GIS_MCP_ACTIVATION_ID}" ]] \
                || [[ "${prepared_lines[2]:-}" != "clientId=${gis_initial_activation_client_id}" ]] \
                || [[ "${prepared_lines[3]:-}" != "gitSha=${gis_initial_activation_prepared_git_sha}" ]] \
                || [[ "${prepared_lines[4]:-}" != "runtimeEnvSha256=${gis_initial_activation_prepared_env_sha256}" ]] \
                || [[ "${prepared_lines[5]:-}" != "tokenCommitment=${EXPECTED_GIS_MCP_TOKEN_COMMITMENT}" ]]; then
                return 1
              fi
              sync -f "${gis_initial_activation_receipt_path}" || return 1
              sync -f "${gis_initial_activation_receipts_dir}" || return 1
            }

            cleanup_gis_initial_activation_registry_residue() {
              local current_dir_identity=""

              if [[ "${gis_registry_json_source_at_start}" -ne 1 ]] \
                || [[ "${gis_initial_activation_recovery_required}" -ne 0 ]] \
                || { [[ "${gis_initial_activation_registry_dir_created}" -ne 1 ]] \
                  && [[ "${gis_initial_activation_registry_cleanup_armed}" -ne 1 ]]; }; then
                return 0
              fi
              # marker/file-mode가 이미 커밋된 상태에서는 어떤 registry도 지우지 않는다.
              if [[ "${gis_registry_marker_present}" -ne 0 ]] \
                || [[ -e "${gis_registry_marker}" || -L "${gis_registry_marker}" ]]; then
                return 1
              fi
              gis_cleanup_dir_uid="$(stat -c '%u' "${gis_registry_host_dir}" 2>/dev/null)"
              gis_cleanup_dir_gid="$(stat -c '%g' "${gis_registry_host_dir}" 2>/dev/null)"
              if [[ ! -d "${gis_registry_host_dir}" \
                || -L "${gis_registry_host_dir}" ]] \
                || [[ "$(stat -c '%a' "${gis_registry_host_dir}" 2>/dev/null)" != "700" ]] \
                || { [[ "${gis_cleanup_dir_uid}:${gis_cleanup_dir_gid}" != "1001:1001" ]] \
                  && { [[ "${gis_initial_activation_registry_dir_created}" -ne 1 ]] \
                    || [[ "${gis_initial_activation_registry_cleanup_armed}" -ne 0 ]] \
                    || [[ "${gis_cleanup_dir_uid}:${gis_cleanup_dir_gid}" \
                      != "$(id -u):$(id -g)" ]]; }; }; then
                return 1
              fi
              if [[ "${gis_initial_activation_registry_dir_created}" -eq 1 \
                || "${gis_initial_activation_registry_cleanup_armed}" -eq 1 ]]; then
                current_dir_identity="$(stat -c '%d:%i' "${gis_registry_host_dir}" 2>/dev/null)"
                if [[ -z "${gis_initial_activation_registry_dir_identity}" ]] \
                  || [[ "${current_dir_identity}" \
                    != "${gis_initial_activation_registry_dir_identity}" ]]; then
                  return 1
                fi
              fi

              if [[ "${gis_initial_activation_registry_cleanup_armed}" -eq 1 ]]; then
                # empty-directory attestation 뒤 이 run이 만든 exact registry artifacts만
                # 동일 JSON 내용 검증 후 UID 1001 context에서 제거한다.
                if ! docker run --rm \
                  --user 1001:1001 \
                  --network none \
                  --read-only \
                  --cap-drop ALL \
                  --security-opt no-new-privileges \
                  --env-file .env \
                  --mount \
                    "type=bind,src=${gis_registry_host_dir},dst=${gis_registry_container_dir}" \
                  "${IMAGE}" \
                  node -e '
                    const assert = require("node:assert/strict");
                    const fs = require("node:fs");
                    const dir = "/run/secrets/tonghari-gis-mcp";
                    const registryName = "clients.json";
                    const lockName = "clients.json.lock";
                    const temporaryPattern = /^\.clients\.json\.[1-9][0-9]*\.[0-9a-f]{24}\.tmp$/;
                    const names = fs.readdirSync(dir);
                    if (names.some((name) => name !== registryName
                      && name !== lockName && !temporaryPattern.test(name))) {
                      process.exit(1);
                    }
                    const privateFileStats = new Map();
                    const validatePrivateFile = (name) => {
                      const file = fs.lstatSync(`${dir}/${name}`);
                      if (!file.isFile() || file.isSymbolicLink()
                        || file.uid !== 1001 || file.gid !== 1001
                        || (file.mode & 0o7777) !== 0o600) {
                        process.exit(1);
                      }
                      privateFileStats.set(name, file);
                    };
                    const privateFileNames = names.filter((name) =>
                      name === registryName || temporaryPattern.test(name)
                    );
                    for (const name of privateFileNames) validatePrivateFile(name);
                    for (const name of privateFileNames) {
                      const file = privateFileStats.get(name);
                      const inDirectoryLinkCount = privateFileNames.filter((otherName) => {
                        const other = privateFileStats.get(otherName);
                        return other.dev === file.dev && other.ino === file.ino;
                      }).length;
                      if (file.nlink !== inDirectoryLinkCount) process.exit(1);
                    }
                    if (names.includes(registryName)) {
                      try {
                        const actual = JSON.parse(
                          fs.readFileSync(`${dir}/${registryName}`, "utf8")
                        );
                        const expected = JSON.parse(
                          process.env.GIS_MCP_TOKEN_REGISTRY_JSON || ""
                        );
                        assert.deepStrictEqual(actual, expected);
                      } catch {
                        process.exit(1);
                      }
                    }
                    for (const name of names.filter((entry) => temporaryPattern.test(entry))) {
                      fs.unlinkSync(`${dir}/${name}`);
                    }
                    if (names.includes(registryName)) {
                      const published = fs.lstatSync(`${dir}/${registryName}`);
                      if (published.nlink !== 1) process.exit(1);
                      fs.unlinkSync(`${dir}/${registryName}`);
                    }
                    if (names.includes(lockName)) {
                      const lock = fs.lstatSync(`${dir}/${lockName}`);
                      if (!lock.isDirectory() || lock.isSymbolicLink()
                        || lock.uid !== 1001 || lock.gid !== 1001
                        || (lock.mode & 0o7777) !== 0o700
                        || fs.readdirSync(`${dir}/${lockName}`).length !== 0) {
                        process.exit(1);
                      }
                      fs.rmdirSync(`${dir}/${lockName}`);
                    }
                    if (fs.readdirSync(dir).length !== 0) process.exit(1);
                    const descriptor = fs.openSync(dir, fs.constants.O_RDONLY);
                    try {
                      fs.fsyncSync(descriptor);
                    } finally {
                      fs.closeSync(descriptor);
                    }
                  '; then
                  return 1
                fi
              fi

              if [[ "${gis_initial_activation_registry_dir_created}" -eq 1 ]]; then
                current_dir_identity="$(stat -c '%d:%i' "${gis_registry_host_dir}" 2>/dev/null)"
                if [[ "${current_dir_identity}" \
                  != "${gis_initial_activation_registry_dir_identity}" ]] \
                  || ! rmdir -- "${gis_registry_host_dir}" \
                  || [[ -e "${gis_registry_host_dir}" \
                    || -L "${gis_registry_host_dir}" ]]; then
                  return 1
                fi
                sync -f "${HOME}/alimtalk-proxy" || return 1
              fi
              gis_initial_activation_registry_cleanup_armed=0
              gis_initial_activation_registry_dir_created=0
              gis_initial_activation_registry_dir_identity=""
            }

            rollback() {
              local exit_code="$1"
              rollback_cleanup_failed=0
              service_recovery_failed=0
              trap - ERR INT TERM HUP EXIT
              set +e
              logout_registry

              if [[ -n "${legal_registry_env_next}" ]]; then
                legal_registry_env_next_path_valid=0
                case "${legal_registry_env_next}" in
                  "${HOME}/alimtalk-proxy/".env.legal-mcp.next.*)
                    legal_registry_env_next_path_valid=1
                    ;;
                esac
                if [[ "${legal_registry_env_next_path_valid}" -ne 1 ]] \
                  || [[ ! -f "${legal_registry_env_next}" ]] \
                  || [[ -L "${legal_registry_env_next}" ]] \
                  || [[ "$(stat -c '%u' "${legal_registry_env_next}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${legal_registry_env_next}" 2>/dev/null)" != "600" ]] \
                  || ! rm -f -- "${legal_registry_env_next}" \
                  || [[ -e "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]]; then
                  echo "ROLLBACK_FAILED: legal MCP next env cleanup failed."
                  rollback_cleanup_failed=1
                fi
                legal_registry_env_next=""
              fi

              if [[ -n "${gis_registry_env_next}" ]]; then
                gis_registry_env_next_path_valid=0
                case "${gis_registry_env_next}" in
                  "${HOME}/alimtalk-proxy/".env.gis-mcp.next.*)
                    gis_registry_env_next_path_valid=1
                    ;;
                esac
                if [[ "${gis_registry_env_next_path_valid}" -ne 1 ]] \
                  || [[ ! -f "${gis_registry_env_next}" ]] \
                  || [[ -L "${gis_registry_env_next}" ]] \
                  || [[ "$(stat -c '%u' "${gis_registry_env_next}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${gis_registry_env_next}" 2>/dev/null)" != "600" ]] \
                  || ! rm -f -- "${gis_registry_env_next}" \
                  || [[ -e "${gis_registry_env_next}" || -L "${gis_registry_env_next}" ]]; then
                  echo "ROLLBACK_FAILED: GIS MCP next env cleanup failed."
                  rollback_cleanup_failed=1
                fi
                gis_registry_env_next=""
              fi

              if [[ "${candidate_started}" -eq 1 ]] \
                && docker container inspect "${CANDIDATE_CONTAINER}" >/dev/null 2>&1; then
                docker logs --tail 200 "${CANDIDATE_CONTAINER}" || true
                if ! docker rm -f "${CANDIDATE_CONTAINER}"; then
                  echo "Candidate cleanup failed; manual cleanup is required."
                  rollback_cleanup_failed=1
                fi
              fi

              echo "Deployment verification failed; restoring the previous container."
              if [[ "${new_container_attempted}" -eq 1 ]] \
                && docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
                docker logs --tail 200 "${CONTAINER_NAME}" || true
                if ! docker rm -f "${CONTAINER_NAME}"; then
                  echo "ROLLBACK_FAILED: failed candidate could not be removed."
                  service_recovery_failed=1
                fi
              fi

              gis_registry_residue_containers_absent=1
              if docker container inspect "${CANDIDATE_CONTAINER}" >/dev/null 2>&1 \
                || { [[ "${new_container_attempted}" -eq 1 ]] \
                  && docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; }; then
                # registry를 mount할 수 있는 새 container가 남았으면 unlink하지 않는다.
                gis_registry_residue_containers_absent=0
              fi
              if [[ "${gis_registry_residue_containers_absent}" -eq 1 ]]; then
                if ! cleanup_gis_initial_activation_registry_residue; then
                  echo "ROLLBACK_FAILED: initial GIS MCP registry residue was preserved for review."
                  rollback_cleanup_failed=1
                fi
              else
                echo "ROLLBACK_FAILED: initial GIS MCP registry residue remains mounted and was preserved."
                rollback_cleanup_failed=1
              fi

              if [[ "${had_previous}" -eq 1 ]]; then
                restore_source=""
                if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
                  current_image_id="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
                  if [[ "${current_image_id}" == "${previous_image_id}" ]]; then
                    restore_source="${CONTAINER_NAME}"
                  else
                    echo "ROLLBACK_FAILED: current container is not the previous image."
                    service_recovery_failed=1
                  fi
                elif docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  rollback_image_id="$(docker container inspect --format '{{.Image}}' "${ROLLBACK_CONTAINER}")"
                  if [[ "${rollback_image_id}" != "${previous_image_id}" ]]; then
                    echo "ROLLBACK_FAILED: rollback container image ID is not the previous image."
                    service_recovery_failed=1
                  elif docker rename "${ROLLBACK_CONTAINER}" "${CONTAINER_NAME}"; then
                    restore_source="${CONTAINER_NAME}"
                  else
                    echo "ROLLBACK_FAILED: rollback container rename failed."
                    service_recovery_failed=1
                  fi
                else
                  echo "ROLLBACK_FAILED: previous container is missing."
                  service_recovery_failed=1
                fi

                # 임시 file 정리 실패와 무관하게 가능한 서비스 복구는 항상 시도한다.
                if [[ -n "${restore_source}" ]]; then
                  if [[ "${legal_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_file_registry_container_contract "${restore_source}"; then
                    echo "ROLLBACK_FAILED: previous container could revive an environment registry."
                    service_recovery_failed=1
                  elif [[ "${gis_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_gis_file_registry_container_contract "${restore_source}"; then
                    echo "ROLLBACK_FAILED: previous container could revive a GIS environment registry."
                    service_recovery_failed=1
                  elif ! docker start "${restore_source}" >/dev/null; then
                    echo "ROLLBACK_FAILED: previous container could not be started."
                    service_recovery_failed=1
                  elif [[ "$(docker container inspect --format '{{.Image}}' "${restore_source}")" != "${previous_image_id}" ]]; then
                    echo "ROLLBACK_FAILED: restored container image ID changed unexpectedly."
                    service_recovery_failed=1
                  elif ! verify_status_ok "${restore_source}" 3100; then
                    echo "ROLLBACK_FAILED: restored container health check failed."
                    service_recovery_failed=1
                  elif [[ "${legal_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_legal_registry_health "${restore_source}" 3100; then
                    echo "ROLLBACK_FAILED: restored legal MCP registry health check failed."
                    service_recovery_failed=1
                  elif [[ "${gis_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_gis_registry_health "${restore_source}" 3100; then
                    echo "ROLLBACK_FAILED: restored GIS MCP registry health check failed."
                    service_recovery_failed=1
                  else
                    echo "Previous container restored and health-checked successfully."
                  fi
                fi
              fi

              if [[ "${rollback_cleanup_failed}" -ne 0 ]] \
                || [[ "${service_recovery_failed}" -ne 0 ]]; then
                echo "ROLLBACK_FAILED: containers were preserved for manual recovery."
                exit 70
              fi

              exit "${exit_code}"
            }

            postcommit_cleanup() {
              local exit_code="$1"
              local cleanup_failed=0
              local next_env_path_valid=0

              trap - ERR INT TERM HUP EXIT
              set +e
              logout_registry

              if [[ "${legal_registry_finalization_required}" -eq 1 \
                || "${gis_registry_finalization_required}" -eq 1 ]] \
                && docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 || cleanup_failed=1
              fi
              if [[ "${legal_registry_finalization_required}" -eq 1 \
                || "${gis_registry_finalization_required}" -eq 1 ]] \
