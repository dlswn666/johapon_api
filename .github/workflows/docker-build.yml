name: Docker Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      land_area_sync_allowlist_sha256:
        description: '승인된 canonical LAND_AREA_SYNC allowlist SHA-256 (enabled=true일 때 필수)'
        required: false
        type: string
      land_area_sync_allowlist_count:
        description: '승인된 LAND_AREA_SYNC allowlist target 수 (enabled=true일 때 필수)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tonghari-api-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/dlswn666/alimtalk-proxy

jobs:
  preflight:
    name: EC2 deployment preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main branch and EC2 connection secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_FINGERPRINT: ${{ secrets.EC2_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must run from refs/heads/main (received ${GITHUB_REF})."
            exit 1
          fi

          missing=()
          for secret_name in \
            EC2_HOST \
            EC2_USERNAME \
            EC2_SSH_KEY \
            EC2_SSH_FINGERPRINT
          do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf -v missing_list '%s, ' "${missing[@]}"
            echo "::error::Missing required deployment secrets: ${missing_list%, }."
            exit 1
          fi

  quality-gates:
    name: Tests, TypeScript and writer guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Verify property-building writer boundary
        run: node scripts/check-property-building-link-writers.mjs

  build-and-push:
    name: Build immutable image
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Prepare immutable build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        # docker/login-action v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        # docker/build-push-action v5
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            IMAGE_TAG=${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Require pushed image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker build did not return a valid immutable digest."
            exit 1
          fi
          echo "Pushed immutable image digest ${IMAGE_DIGEST}."

  deploy:
    name: Deploy and verify exact revision
    needs: [preflight, build-and-push]
    runs-on: ubuntu-latest
    # production lock 40분 + operation lock 45분 + 실제 배포/rollback 30분을
    # 모두 command/job 취소 전에 완료하고 후처리 여유를 남긴다.
    timeout-minutes: 130
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy immutable image to EC2
        # appleboy/ssh-action v1.2.5
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_ALLOWLIST_DIGEST: ${{ inputs.land_area_sync_allowlist_sha256 || '' }}
          EXPECTED_ALLOWLIST_COUNT: ${{ inputs.land_area_sync_allowlist_count || '' }}
          DEPLOY_IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_GIT_SHA: ${{ github.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          DEPLOY_BUILD_TIME: ${{ needs.build-and-push.outputs.build_time }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 120m
          envs: GHCR_USERNAME,GHCR_TOKEN,DEPLOY_EVENT_NAME,EXPECTED_ALLOWLIST_DIGEST,EXPECTED_ALLOWLIST_COUNT,DEPLOY_IMAGE_REPOSITORY,DEPLOY_GIT_SHA,DEPLOY_IMAGE_DIGEST,DEPLOY_BUILD_TIME
          script: |
            set -Eeuo pipefail

            cd "$HOME/alimtalk-proxy"

            production_lock_path="${HOME}/alimtalk-proxy/.tonghari-api-production.lock"
            operation_lock_path="${HOME}/alimtalk-proxy/.land-area-sync-operation.lock"
            if [[ ! -e "${production_lock_path}" && ! -L "${production_lock_path}" ]]; then
              (
                umask 077
                set -o noclobber
                : > "${production_lock_path}"
              ) 2>/dev/null || true
            fi
            if [[ ! -f "${production_lock_path}" || -L "${production_lock_path}" ]] \
              || [[ "$(stat -c '%u' "${production_lock_path}")" != "$(id -u)" ]] \
              || [[ "$(stat -c '%a' "${production_lock_path}")" != "600" ]]; then
              echo "Shared production lock must be a deploy-user-owned regular mode 600 file."
              false
            fi
            exec 9>>"${production_lock_path}"
            if ! flock -w 2400 9; then
              echo "Timed out waiting for the shared production deployment lock."
              false
            fi

            if [[ ! -e "${operation_lock_path}" && ! -L "${operation_lock_path}" ]]; then
              (
                umask 077
                set -o noclobber
                : > "${operation_lock_path}"
              ) 2>/dev/null || true
            fi
            if [[ ! -f "${operation_lock_path}" || -L "${operation_lock_path}" ]] \
              || [[ "$(stat -c '%u' "${operation_lock_path}")" != "$(id -u)" ]] \
              || [[ "$(stat -c '%a' "${operation_lock_path}")" != "600" ]]; then
              echo "Land-area operation lock must be a deploy-user-owned regular mode 600 file."
              false
            fi
            exec 8>>"${operation_lock_path}"
            if ! flock -w 2700 8; then
              echo "Timed out waiting for the bounded land-area operation lock."
              false
            fi

            IMAGE_REPOSITORY="${DEPLOY_IMAGE_REPOSITORY}"
            IMAGE_TAG="${IMAGE_REPOSITORY}:${DEPLOY_GIT_SHA}"
            EXPECTED_DIGEST="${DEPLOY_IMAGE_DIGEST}"
            IMAGE="${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
            EXPECTED_GIT_SHA="${DEPLOY_GIT_SHA}"
            EXPECTED_BUILD_TIME="${DEPLOY_BUILD_TIME}"
            EXPECTED_IMAGE_TAG="${IMAGE_TAG}"
            CONTAINER_NAME="alimtalk-proxy"
            CANDIDATE_CONTAINER="${CONTAINER_NAME}-candidate"
            ROLLBACK_CONTAINER="${CONTAINER_NAME}-rollback"
            had_previous=0
            new_container_attempted=0
            candidate_started=0
            registry_logged_in=0
            previous_image_id=""
            legal_registry_host_dir="${HOME}/alimtalk-proxy/.legal-mcp-secrets"
            legal_registry_container_dir="/run/secrets/tonghari-legal-mcp"
            legal_registry_container_file="${legal_registry_container_dir}/clients.json"
            legal_registry_marker="${HOME}/alimtalk-proxy/.legal-mcp-file-registry-v1"
            legal_registry_env_next=""
            legal_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
            legal_registry_client_count=""
            legal_registry_required_at_start=0
            legal_registry_finalization_required=0
            legal_registry_needs_next_env=0
            legal_registry_json_source_at_start=0
            deployment_phase="precommit"

            for variable_name in \
              GHCR_USERNAME \
              GHCR_TOKEN \
              DEPLOY_EVENT_NAME \
              DEPLOY_IMAGE_REPOSITORY \
              DEPLOY_GIT_SHA \
              DEPLOY_IMAGE_DIGEST \
              DEPLOY_BUILD_TIME
            do
              if [[ -z "${!variable_name:-}" ]]; then
                echo "Required deployment variable ${variable_name} was not transferred to EC2."
                false
              fi
            done

            if [[ ! -f .env || -L .env ]]; then
              echo "Runtime .env must exist as a regular, non-symlink file on EC2."
              false
            fi

            env_owner="$(stat -c '%U' .env)"
            env_mode="$(stat -c '%a' .env)"
            if [[ "${env_owner}" != "$(id -un)" || "${env_mode}" != "600" ]]; then
              echo "Runtime .env must be owned by the deploy user with mode 600."
              false
            fi

            legal_registry_file_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_FILE[[:space:]]*=' \
                .env || true
            )"
            legal_registry_json_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' \
                .env || true
            )"
            legal_registry_legacy_definition_count="$(
              grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=' \
                .env || true
            )"
            for definition_count in \
              "${legal_registry_file_definition_count}" \
              "${legal_registry_json_definition_count}" \
              "${legal_registry_legacy_definition_count}"
            do
              if [[ "${definition_count}" -gt 1 ]]; then
                echo "Runtime .env has duplicate legal MCP authentication keys."
                false
              fi
            done

            legal_registry_file_exact_count="$(
              grep -Fxc \
                "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" \
                .env || true
            )"
            legal_registry_file_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_FILE=.+$' .env || true
            )"
            legal_registry_json_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_JSON=.+$' .env || true
            )"
            legal_registry_legacy_nonempty_count="$(
              grep -Ec '^LEGAL_MCP_TOKEN_SHA256=.+$' .env || true
            )"

            legal_registry_marker_present=0
            if [[ -e "${legal_registry_marker}" || -L "${legal_registry_marker}" ]]; then
              if [[ ! -f "${legal_registry_marker}" || -L "${legal_registry_marker}" ]] \
                || [[ "$(stat -c '%u' "${legal_registry_marker}")" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_marker}")" != "600" ]] \
                || [[ "$(<"${legal_registry_marker}")" != "version=1" ]]; then
                echo "Legal MCP file-registry marker is invalid."
                false
              fi
              legal_registry_marker_present=1
              legal_registry_required_at_start=1
              if [[ "${legal_registry_file_definition_count}" != "1" ]] \
                || [[ "${legal_registry_file_exact_count}" != "1" ]] \
                || [[ "${legal_registry_json_definition_count}" != "0" ]] \
                || [[ "${legal_registry_legacy_definition_count}" != "0" ]]; then
                echo "Migrated runtime .env must use only the fixed legal MCP registry file."
                false
              fi
            else
              legal_registry_finalization_required=1
              if [[ "${legal_registry_file_exact_count}" == "1" ]] \
                && [[ "${legal_registry_json_nonempty_count}" == "0" ]] \
                && [[ "${legal_registry_legacy_nonempty_count}" == "0" ]]; then
                # final health 통과 후 cleanup이 끊긴 경우를 안전하게 마감한다.
                legal_registry_required_at_start=1
                if [[ "${legal_registry_json_definition_count}" != "0" ]] \
                  || [[ "${legal_registry_legacy_definition_count}" != "0" ]]; then
                  legal_registry_needs_next_env=1
                fi
              elif [[ "${legal_registry_json_definition_count}" == "1" ]] \
                && [[ "${legal_registry_json_nonempty_count}" == "1" ]] \
                && [[ "${legal_registry_file_nonempty_count}" == "0" ]] \
                && [[ "${legal_registry_legacy_nonempty_count}" == "0" ]]; then
                # 최초 1회만 EC2의 기존 JSON registry를 file로 이전한다.
                legal_registry_needs_next_env=1
                legal_registry_json_source_at_start=1
              else
                echo "Pre-migration runtime .env must contain one non-empty legal MCP JSON registry."
                false
              fi
            fi

            shopt -s nullglob
            legal_registry_orphan_next_envs=(
              "${HOME}/alimtalk-proxy"/.env.legal-mcp.next.*
            )
            shopt -u nullglob
            if (( ${#legal_registry_orphan_next_envs[@]} > 0 )); then
              echo "CLEANUP_FAILED: orphan legal MCP next env requires manual review."
              false
            fi
            if ! docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
              echo "RECOVERY_REQUIRED: current container is missing while rollback exists; it will not be started automatically."
              false
            fi
            if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && [[ "$(docker container inspect --format '{{.State.Running}}' "${CONTAINER_NAME}")" != "true" ]]; then
              echo "RECOVERY_REQUIRED: an existing current container must be running before deployment."
              false
            fi

            for variable_name in \
              DEV_API_JWT_SECRET \
              DEV_SUPABASE_URL \
              DEV_SUPABASE_SERVICE_ROLE_KEY
            do
              definition_count="$(grep -c "^${variable_name}=" .env || true)"
              if [[ "${definition_count}" != "1" ]] \
                || ! grep -Eq "^${variable_name}=.+" .env; then
                echo "Runtime .env must contain exactly one non-empty ${variable_name} entry."
                false
              fi
            done

            operation_target_count="$(grep -c '^BUILDING_WRITE_OPERATION_TARGETS=' .env || true)"
            if [[ "${operation_target_count}" != "1" ]]; then
              echo "Runtime .env must contain exactly one BUILDING_WRITE_OPERATION_TARGETS entry."
              false
            fi
            if ! grep -qx 'BUILDING_WRITE_OPERATION_TARGETS=development' .env; then
              echo "Runtime .env BUILDING_WRITE_OPERATION_TARGETS must be exactly development."
              false
            fi

            land_area_sync_flag_count="$(grep -Ec '^[[:space:]]*LAND_AREA_SYNC_ENABLED[[:space:]]*=' .env || true)"
            if [[ "${land_area_sync_flag_count}" -gt 1 ]]; then
              echo "Runtime .env may contain at most one LAND_AREA_SYNC_ENABLED entry."
              false
            fi
            expected_land_area_sync_enabled=false
            if [[ "${land_area_sync_flag_count}" -eq 1 ]]; then
              if grep -qx 'LAND_AREA_SYNC_ENABLED=true' .env; then
                expected_land_area_sync_enabled=true
              elif ! grep -qx 'LAND_AREA_SYNC_ENABLED=false' .env; then
                echo "Runtime .env LAND_AREA_SYNC_ENABLED must be exactly true or false."
                false
              fi
            fi

            allowed_targets_count="$(grep -c '^LAND_AREA_SYNC_ALLOWED_TARGETS=' .env || true)"
            if [[ "${allowed_targets_count}" -gt 1 ]]; then
              echo "Runtime .env may contain at most one LAND_AREA_SYNC_ALLOWED_TARGETS entry."
              false
            fi
            if [[ "${expected_land_area_sync_enabled}" == "true" ]]; then
              if [[ "${DEPLOY_EVENT_NAME}" != "workflow_dispatch" ]]; then
                echo "Enabled LAND_AREA_SYNC is allowed only for an explicit workflow_dispatch."
                false
              fi
              if [[ ! "${EXPECTED_ALLOWLIST_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "Enabled LAND_AREA_SYNC requires an approved canonical allowlist SHA-256 input."
                false
              fi
              if [[ ! "${EXPECTED_ALLOWLIST_COUNT}" =~ ^[1-9][0-9]*$ ]]; then
                echo "Enabled LAND_AREA_SYNC requires a positive approved allowlist count input."
                false
              fi
              if [[ "${allowed_targets_count}" != "1" ]] \
                || ! grep -Eq '^LAND_AREA_SYNC_ALLOWED_TARGETS=.+$' .env; then
                echo "Enabled LAND_AREA_SYNC requires one non-empty allowlist."
                false
              fi

              allowed_targets_line="$(grep '^LAND_AREA_SYNC_ALLOWED_TARGETS=' .env)"
              allowed_targets_value="${allowed_targets_line#*=}"
              IFS=',' read -r -a allowed_target_entries <<< "${allowed_targets_value}"
              if [[ "${#allowed_target_entries[@]}" -eq 0 ]]; then
                echo "LAND_AREA_SYNC allowlist must contain at least one target."
                false
              fi
              for allowed_target_entry in "${allowed_target_entries[@]}"; do
                if [[ ! "${allowed_target_entry}" =~ ^development:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}:[0-9]{19}$ ]]; then
                  echo "Enabled LAND_AREA_SYNC permits only exact development:unionUuid:PNU entries."
                  false
                fi
              done
            elif [[ "${allowed_targets_count}" -eq 1 ]] \
              && ! grep -qx 'LAND_AREA_SYNC_ALLOWED_TARGETS=' .env; then
              echo "Disabled LAND_AREA_SYNC requires an empty allowlist."
              false
            fi

            logout_registry() {
              if [[ "${registry_logged_in}" -eq 1 ]]; then
                docker logout ghcr.io >/dev/null 2>&1 || true
                registry_logged_in=0
              fi
            }

            verify_status_ok() {
              local container_name="$1"
              local port="$2"

              for attempt in $(seq 1 15); do
                if curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${port}/health" \
                  | docker exec -i "${container_name}" node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          process.exit(JSON.parse(body).status === "ok" ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
                then
                  return 0
                fi
                sleep 2
              done

              return 1
            }

            verify_file_registry_container_contract() {
              local container_name="$1"
              local configured_environment=""
              local registry_mount=""

              configured_environment="$(
                docker container inspect \
                  --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "${container_name}"
              )" || return 1
              if [[ "$(grep -Fxc "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" <<< "${configured_environment}" || true)" != "1" ]] \
                || [[ "$(grep -Ec '^LEGAL_MCP_TOKEN_REGISTRY_JSON=' <<< "${configured_environment}" || true)" != "0" ]] \
                || [[ "$(grep -Ec '^LEGAL_MCP_TOKEN_SHA256=' <<< "${configured_environment}" || true)" != "0" ]]; then
                return 1
              fi

              registry_mount="$(
                docker container inspect --format \
                  '{{range .Mounts}}{{if eq .Destination "/run/secrets/tonghari-legal-mcp"}}{{.Type}}|{{.RW}}|{{.Source}}{{println}}{{end}}{{end}}' \
                  "${container_name}"
              )" || return 1
              [[ "${registry_mount}" == "bind|false|${legal_registry_host_dir}" ]]
            }

            verify_legal_registry_health() {
              local container_name="$1"
              local port="$2"

              curl -fsS --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" \
                | docker exec -i \
                    -e EXPECTED_LEGAL_MCP_CLIENT_COUNT="${legal_registry_client_count}" \
                    "${container_name}" \
                    node -e '
                      let body = "";
                      process.stdin.setEncoding("utf8");
                      process.stdin.on("data", (chunk) => { body += chunk; });
                      process.stdin.on("end", () => {
                        try {
                          const health = JSON.parse(body);
                          const valid = health.features?.legalMcpConfigurationValid === true
                            && health.features?.legalMcpAuthMode === "client_registry"
                            && health.features?.legalMcpAuthSource === "file_registry"
                            && String(health.features?.legalMcpRegisteredClientCount)
                              === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT
                            && String(health.features?.legalMcpRegisteredTokenCount)
                              === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT;
                          process.exit(valid ? 0 : 1);
                        } catch {
                          process.exit(1);
                        }
                      });
                    ' >/dev/null 2>&1
            }

            rollback() {
              local exit_code="$1"
              rollback_cleanup_failed=0
              service_recovery_failed=0
              trap - ERR INT TERM HUP EXIT
              set +e
              logout_registry

              if [[ -n "${legal_registry_env_next}" ]]; then
                legal_registry_env_next_path_valid=0
                case "${legal_registry_env_next}" in
                  "${HOME}/alimtalk-proxy/".env.legal-mcp.next.*)
                    legal_registry_env_next_path_valid=1
                    ;;
                esac
                if [[ "${legal_registry_env_next_path_valid}" -ne 1 ]] \
                  || [[ ! -f "${legal_registry_env_next}" ]] \
                  || [[ -L "${legal_registry_env_next}" ]] \
                  || [[ "$(stat -c '%u' "${legal_registry_env_next}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${legal_registry_env_next}" 2>/dev/null)" != "600" ]] \
                  || ! rm -f -- "${legal_registry_env_next}" \
                  || [[ -e "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]]; then
                  echo "ROLLBACK_FAILED: legal MCP next env cleanup failed."
                  rollback_cleanup_failed=1
                fi
                legal_registry_env_next=""
              fi

              if [[ "${candidate_started}" -eq 1 ]] \
                && docker container inspect "${CANDIDATE_CONTAINER}" >/dev/null 2>&1; then
                docker logs --tail 200 "${CANDIDATE_CONTAINER}" || true
                if ! docker rm -f "${CANDIDATE_CONTAINER}"; then
                  echo "Candidate cleanup failed; manual cleanup is required."
                  rollback_cleanup_failed=1
                fi
              fi

              echo "Deployment verification failed; restoring the previous container."
              if [[ "${new_container_attempted}" -eq 1 ]] \
                && docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
                docker logs --tail 200 "${CONTAINER_NAME}" || true
                if ! docker rm -f "${CONTAINER_NAME}"; then
                  echo "ROLLBACK_FAILED: failed candidate could not be removed."
                  service_recovery_failed=1
                fi
              fi

              if [[ "${had_previous}" -eq 1 ]]; then
                restore_source=""
                if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
                  current_image_id="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
                  if [[ "${current_image_id}" == "${previous_image_id}" ]]; then
                    restore_source="${CONTAINER_NAME}"
                  else
                    echo "ROLLBACK_FAILED: current container is not the previous image."
                    service_recovery_failed=1
                  fi
                elif docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  rollback_image_id="$(docker container inspect --format '{{.Image}}' "${ROLLBACK_CONTAINER}")"
                  if [[ "${rollback_image_id}" != "${previous_image_id}" ]]; then
                    echo "ROLLBACK_FAILED: rollback container image ID is not the previous image."
                    service_recovery_failed=1
                  elif docker rename "${ROLLBACK_CONTAINER}" "${CONTAINER_NAME}"; then
                    restore_source="${CONTAINER_NAME}"
                  else
                    echo "ROLLBACK_FAILED: rollback container rename failed."
                    service_recovery_failed=1
                  fi
                else
                  echo "ROLLBACK_FAILED: previous container is missing."
                  service_recovery_failed=1
                fi

                # 임시 file 정리 실패와 무관하게 가능한 서비스 복구는 항상 시도한다.
                if [[ -n "${restore_source}" ]]; then
                  if [[ "${legal_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_file_registry_container_contract "${restore_source}"; then
                    echo "ROLLBACK_FAILED: previous container could revive an environment registry."
                    service_recovery_failed=1
                  elif ! docker start "${restore_source}" >/dev/null; then
                    echo "ROLLBACK_FAILED: previous container could not be started."
                    service_recovery_failed=1
                  elif [[ "$(docker container inspect --format '{{.Image}}' "${restore_source}")" != "${previous_image_id}" ]]; then
                    echo "ROLLBACK_FAILED: restored container image ID changed unexpectedly."
                    service_recovery_failed=1
                  elif ! verify_status_ok "${restore_source}" 3100; then
                    echo "ROLLBACK_FAILED: restored container health check failed."
                    service_recovery_failed=1
                  elif [[ "${legal_registry_required_at_start}" -eq 1 ]] \
                    && ! verify_legal_registry_health "${restore_source}" 3100; then
                    echo "ROLLBACK_FAILED: restored legal MCP registry health check failed."
                    service_recovery_failed=1
                  else
                    echo "Previous container restored and health-checked successfully."
                  fi
                fi
              fi

              if [[ "${rollback_cleanup_failed}" -ne 0 ]] \
                || [[ "${service_recovery_failed}" -ne 0 ]]; then
                echo "ROLLBACK_FAILED: containers were preserved for manual recovery."
                exit 70
              fi

              exit "${exit_code}"
            }

            postcommit_cleanup() {
              local exit_code="$1"
              local cleanup_failed=0
              local next_env_path_valid=0

              trap - ERR INT TERM HUP EXIT
              set +e
              logout_registry

              if [[ "${legal_registry_finalization_required}" -eq 1 ]] \
                && docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1 || cleanup_failed=1
              fi
              if [[ "${legal_registry_finalization_required}" -eq 1 ]] \
                && docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                cleanup_failed=1
              fi

              if [[ -n "${legal_registry_env_next}" ]]; then
                case "${legal_registry_env_next}" in
                  "${HOME}/alimtalk-proxy/".env.legal-mcp.next.*)
                    next_env_path_valid=1
                    ;;
                esac
                if [[ "${next_env_path_valid}" -ne 1 ]] \
                  || [[ ! -f "${legal_registry_env_next}" ]] \
                  || [[ -L "${legal_registry_env_next}" ]] \
                  || [[ "$(stat -c '%u' "${legal_registry_env_next}" 2>/dev/null)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${legal_registry_env_next}" 2>/dev/null)" != "600" ]] \
                  || ! rm -f -- "${legal_registry_env_next}" \
                  || [[ -e "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]]; then
                  cleanup_failed=1
                fi
                legal_registry_env_next=""
              fi

              if [[ "${cleanup_failed}" -ne 0 ]]; then
                echo "CLEANUP_FAILED: file-mode current remains active; never start the legacy rollback container."
                exit 71
              fi
              case "${exit_code}" in
                129|130|143) ;;
                *) exit_code=71 ;;
              esac
              echo "Deployment ended after the file-mode commit point; legacy rollback was not restarted."
              exit "${exit_code}"
            }

            phase_aware_exit() {
              local exit_code=$?
              trap - ERR INT TERM HUP EXIT
              if [[ "${deployment_phase}" == "precommit" ]]; then
                rollback "${exit_code}"
              elif [[ "${deployment_phase}" == "committed" ]]; then
                postcommit_cleanup "${exit_code}"
              fi
              exit "${exit_code}"
            }

            trap 'exit $?' ERR
            trap 'exit 130' INT
            trap 'exit 143' TERM
            trap 'exit 129' HUP
            trap phase_aware_exit EXIT

            printf '%s' "${GHCR_TOKEN}" \
              | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin >/dev/null 2>&1
            registry_logged_in=1
            docker pull "${IMAGE}"
            logout_registry

            if ! docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}" \
              | grep -Fq "@${EXPECTED_DIGEST}"; then
              echo "Pulled image digest does not match ${EXPECTED_DIGEST}."
              false
            fi

            if [[ -e "${legal_registry_host_dir}" || -L "${legal_registry_host_dir}" ]]; then
              if [[ ! -d "${legal_registry_host_dir}" || -L "${legal_registry_host_dir}" ]] \
                || [[ "$(stat -c '%u' "${legal_registry_host_dir}")" != "1001" ]] \
                || [[ "$(stat -c '%g' "${legal_registry_host_dir}")" != "1001" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_host_dir}")" != "700" ]]; then
                echo "Legal MCP registry directory must be a UID/GID 1001 mode 700 directory."
                false
              fi
            else
              mkdir -m 700 -- "${legal_registry_host_dir}"
              if [[ ! -d "${legal_registry_host_dir}" || -L "${legal_registry_host_dir}" ]] \
                || [[ "$(stat -c '%u' "${legal_registry_host_dir}")" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_host_dir}")" != "700" ]]; then
                echo "New legal MCP registry directory failed its host ownership check."
                false
              fi
              docker run --rm \
                --user 0:0 \
                --network none \
                --read-only \
                --cap-drop ALL \
                --cap-add CHOWN \
                --cap-add FOWNER \
                --security-opt no-new-privileges \
                --mount \
                  "type=bind,src=${legal_registry_host_dir},dst=/registry" \
                "${IMAGE}" \
                sh -eu -c 'chown 1001:1001 /registry && chmod 700 /registry'
              if [[ "$(stat -c '%u' "${legal_registry_host_dir}")" != "1001" ]] \
                || [[ "$(stat -c '%g' "${legal_registry_host_dir}")" != "1001" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_host_dir}")" != "700" ]]; then
                echo "Legal MCP registry directory ownership initialization failed."
                false
              fi
            fi

            legal_registry_validation=""
            if legal_registry_validation="$(
              docker run --rm \
                --network none \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges \
                --mount \
                  "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
                "${IMAGE}" \
                node dist/cli/legal-mcp-registry.js validate \
                  --path "${legal_registry_container_file}"
            )"; then
              :
            else
              if [[ "${legal_registry_marker_present}" -eq 1 ]] \
                || [[ "${legal_registry_required_at_start}" -eq 1 ]]; then
                echo "Configured legal MCP file registry failed validation."
                false
              fi

              legal_registry_initialization="$(
                docker run --rm \
                  --network none \
                  --read-only \
                  --cap-drop ALL \
                  --security-opt no-new-privileges \
                  --env-file .env \
                  --mount \
                    "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir}" \
                  "${IMAGE}" \
                  node dist/cli/legal-mcp-registry.js init-from-env \
                    --path "${legal_registry_container_file}"
              )"
              if [[ ! "${legal_registry_initialization}" =~ ^action=init-from-env[[:space:]]clientCount=([1-9][0-9]*)$ ]]; then
                echo "Legal MCP registry initialization returned an invalid attestation."
                false
              fi
              legal_registry_validation="$(
                docker run --rm \
                  --network none \
                  --read-only \
                  --cap-drop ALL \
                  --security-opt no-new-privileges \
                  --mount \
                    "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
                  "${IMAGE}" \
                  node dist/cli/legal-mcp-registry.js validate \
                    --path "${legal_registry_container_file}"
              )"
            fi

            if [[ ! "${legal_registry_validation}" =~ ^clientCount=([1-9][0-9]*)$ ]]; then
              echo "Legal MCP registry validation returned an invalid attestation."
              false
            fi
            legal_registry_client_count="${BASH_REMATCH[1]}"
            if (( legal_registry_client_count < 1 || legal_registry_client_count > 32 )); then
              echo "Legal MCP registry client count is outside the supported range."
              false
            fi

            if [[ "${legal_registry_json_source_at_start}" -eq 1 ]]; then
              legal_registry_env_match="$(
                docker run --rm \
                  --network none \
                  --read-only \
                  --cap-drop ALL \
                  --security-opt no-new-privileges \
                  --env-file .env \
                  --mount \
                    "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
                  "${IMAGE}" \
                  node dist/cli/legal-mcp-registry.js matches-env \
                    --path "${legal_registry_container_file}"
              )"
              if [[ ! "${legal_registry_env_match}" =~ ^clientCount=([1-9][0-9]*)$ ]] \
                || [[ "${BASH_REMATCH[1]:-}" != "${legal_registry_client_count}" ]]; then
                echo "Legal MCP file registry does not match the current EC2 JSON registry."
                false
              fi
            fi

            if [[ "${legal_registry_needs_next_env}" -eq 1 ]]; then
              legal_registry_env_next="$(
                mktemp "${HOME}/alimtalk-proxy/.env.legal-mcp.next.XXXXXX"
              )"
              chmod 600 "${legal_registry_env_next}"
              export LEGAL_REGISTRY_CONTAINER_FILE="${legal_registry_container_file}"
              awk '
                /^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_FILE[[:space:]]*=/ { next }
                /^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=/ { next }
                /^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=/ { next }
                { print }
                END {
                  print "LEGAL_MCP_TOKEN_REGISTRY_FILE=" \
                    ENVIRON["LEGAL_REGISTRY_CONTAINER_FILE"]
                }
              ' .env > "${legal_registry_env_next}"
              unset LEGAL_REGISTRY_CONTAINER_FILE
              if [[ ! -f "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]] \
                || [[ "$(stat -c '%u' "${legal_registry_env_next}")" != "$(id -u)" ]] \
                || [[ "$(stat -c '%a' "${legal_registry_env_next}")" != "600" ]] \
                || [[ "$(grep -Fxc "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" "${legal_registry_env_next}" || true)" != "1" ]] \
                || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' "${legal_registry_env_next}" || true)" != "0" ]] \
                || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=' "${legal_registry_env_next}" || true)" != "0" ]]; then
                echo "Next runtime .env did not establish an exclusive legal MCP file registry."
                false
              fi
              legal_registry_runtime_env="${legal_registry_env_next}"
            fi

            if [[ "${legal_registry_required_at_start}" -eq 1 ]] \
              && docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1 \
              && ! verify_file_registry_container_contract "${CONTAINER_NAME}"; then
              echo "Running container does not satisfy the committed legal MCP file-registry contract."
              false
            fi

            manifest_attestation="$(
              docker run --rm \
                --env-file .env \
                "${IMAGE}" \
                node dist/cli/land-area-sync-allowlist-manifest.js
            )"
            IFS=':' read -r actual_allowlist_count actual_allowlist_digest manifest_extra \
              <<< "${manifest_attestation}"
            if [[ -n "${manifest_extra:-}" ]] \
              || [[ ! "${actual_allowlist_count}" =~ ^[0-9]+$ ]] \
              || { [[ "${actual_allowlist_count}" -gt 0 ]] \
                && [[ ! "${actual_allowlist_digest}" =~ ^[0-9a-f]{64}$ ]]; }; then
              echo "Candidate image returned an invalid allowlist attestation."
              false
            fi
            if [[ "${expected_land_area_sync_enabled}" == "true" ]]; then
              if [[ "${actual_allowlist_count}" != "${EXPECTED_ALLOWLIST_COUNT}" ]] \
                || [[ "${actual_allowlist_digest}" != "${EXPECTED_ALLOWLIST_DIGEST}" ]]; then
                echo "EC2 allowlist does not match the approved workflow_dispatch artifact."
                false
              fi
            elif [[ "${actual_allowlist_count}" != "0" ]] \
              || [[ -n "${actual_allowlist_digest}" ]]; then
              echo "Disabled LAND_AREA_SYNC attestation must be exactly count=0,digest=empty."
              false
            fi

            verify_health() {
              local container_name="$1"
              local port="$2"

              for attempt in $(seq 1 30); do
                if curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${port}/health" \
                  | docker exec -i \
                      -e EXPECTED_GIT_SHA="${EXPECTED_GIT_SHA}" \
                      -e EXPECTED_BUILD_TIME="${EXPECTED_BUILD_TIME}" \
                      -e EXPECTED_IMAGE_TAG="${EXPECTED_IMAGE_TAG}" \
                      -e EXPECTED_LAND_AREA_SYNC_ENABLED="${expected_land_area_sync_enabled}" \
                      -e EXPECTED_ALLOWLIST_COUNT="${actual_allowlist_count}" \
                      -e EXPECTED_ALLOWLIST_DIGEST="${actual_allowlist_digest}" \
                      -e EXPECTED_LEGAL_MCP_CLIENT_COUNT="${legal_registry_client_count}" \
                      "${container_name}" \
                      node -e '
                        let body = "";
                        process.stdin.setEncoding("utf8");
                        process.stdin.on("data", (chunk) => { body += chunk; });
                        process.stdin.on("end", () => {
                          try {
                            const health = JSON.parse(body);
                            const valid = health.status === "ok"
                              && health.gitSha === process.env.EXPECTED_GIT_SHA
                              && health.buildTime === process.env.EXPECTED_BUILD_TIME
                              && health.imageTag === process.env.EXPECTED_IMAGE_TAG
                              && String(health.features?.landAreaSyncEnabled)
                                === process.env.EXPECTED_LAND_AREA_SYNC_ENABLED
                              && String(health.features?.landAreaSyncAllowedTargetCount)
                                === process.env.EXPECTED_ALLOWLIST_COUNT
                              && health.features?.landAreaSyncAllowedTargetsDigest
                                === process.env.EXPECTED_ALLOWLIST_DIGEST
                              && health.features?.legalMcpConfigurationValid === true
                              && health.features?.legalMcpAuthMode === "client_registry"
                              && health.features?.legalMcpAuthSource === "file_registry"
                              && String(health.features?.legalMcpRegisteredClientCount)
                                === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT
                              && String(health.features?.legalMcpRegisteredTokenCount)
                                === process.env.EXPECTED_LEGAL_MCP_CLIENT_COUNT;
                            process.exit(valid ? 0 : 1);
                          } catch {
                            process.exit(1);
                          }
                        });
                      ' >/dev/null 2>&1
                then
                  return 0
                fi
                sleep 2
              done

              return 1
            }

            docker rm -f "${CANDIDATE_CONTAINER}" >/dev/null 2>&1 || true
            candidate_started=1
            docker run -d \
              --name "${CANDIDATE_CONTAINER}" \
              --restart no \
              -p 127.0.0.1:13100:3100 \
              --env-file "${legal_registry_runtime_env}" \
              --mount \
                "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
              --memory=800m \
              --memory-swap=1600m \
              "${IMAGE}"

            EXPECTED_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE}")"
            CANDIDATE_IMAGE_ID="$(docker container inspect --format '{{.Image}}' "${CANDIDATE_CONTAINER}")"
            if [[ "${CANDIDATE_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
              echo "Candidate container image ID does not match the pulled immutable image."
              false
            fi

            if ! verify_health "${CANDIDATE_CONTAINER}" 13100; then
              echo "Candidate health response did not match git SHA ${EXPECTED_GIT_SHA}."
              false
            fi
            if ! verify_file_registry_container_contract "${CANDIDATE_CONTAINER}"; then
              echo "Candidate did not preserve the legal MCP file-registry contract."
              false
            fi

            docker rm -f "${CANDIDATE_CONTAINER}"
            candidate_started=0

            if docker container inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
              had_previous=1
              previous_image_id="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                docker rm -f "${ROLLBACK_CONTAINER}"
              fi
              docker stop "${CONTAINER_NAME}"
              docker rename "${CONTAINER_NAME}" "${ROLLBACK_CONTAINER}"
            fi

            new_container_attempted=1
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p 127.0.0.1:3100:3100 \
              --env-file "${legal_registry_runtime_env}" \
              --mount \
                "type=bind,src=${legal_registry_host_dir},dst=${legal_registry_container_dir},readonly" \
              -v "$(pwd)/logs:/app/logs" \
              --memory=800m \
              --memory-swap=1600m \
              "${IMAGE}"

            RUNNING_IMAGE_ID="$(docker container inspect --format '{{.Image}}' "${CONTAINER_NAME}")"
            if [[ "${RUNNING_IMAGE_ID}" != "${EXPECTED_IMAGE_ID}" ]]; then
              echo "Running container image ID does not match the pulled immutable image."
              false
            fi

            if ! verify_health "${CONTAINER_NAME}" 3100; then
              echo "Health response did not match git SHA ${EXPECTED_GIT_SHA}."
              false
            fi
            if ! verify_file_registry_container_contract "${CONTAINER_NAME}"; then
              echo "Running container did not preserve the legal MCP file-registry contract."
              false
            fi

            # file-mode final health를 commit point로 삼는다. 이 후에는
            # 구 env registry container를 다시 실행하지 않는다.
            deployment_phase="committed"
            if [[ "${legal_registry_finalization_required}" -eq 1 ]]; then
              legal_registry_cleanup_failed=0

              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                if ! docker rm -f "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                  legal_registry_cleanup_failed=1
                fi
              fi
              if docker container inspect "${ROLLBACK_CONTAINER}" >/dev/null 2>&1; then
                echo "CLEANUP_FAILED: legacy rollback container still exists."
                legal_registry_cleanup_failed=1
              else
                had_previous=0
              fi

              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]] \
                && [[ -n "${legal_registry_env_next}" ]]; then
                if mv -f -- "${legal_registry_env_next}" .env; then
                  legal_registry_env_next=""
                  legal_registry_runtime_env="${HOME}/alimtalk-proxy/.env"
                else
                  legal_registry_cleanup_failed=1
                fi
              fi

              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]]; then
                if [[ ! -f .env || -L .env ]] \
                  || [[ "$(stat -c '%u' .env)" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' .env)" != "600" ]] \
                  || [[ "$(grep -Fxc "LEGAL_MCP_TOKEN_REGISTRY_FILE=${legal_registry_container_file}" .env || true)" != "1" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_REGISTRY_JSON[[:space:]]*=' .env || true)" != "0" ]] \
                  || [[ "$(grep -Ec '^[[:space:]]*LEGAL_MCP_TOKEN_SHA256[[:space:]]*=' .env || true)" != "0" ]]; then
                  echo "CLEANUP_FAILED: file-only runtime .env validation failed."
                  legal_registry_cleanup_failed=1
                fi
              fi

              legal_registry_marker_next=""
              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]]; then
                if legal_registry_marker_next="$(
                  mktemp "${HOME}/alimtalk-proxy/.legal-mcp-file-registry-v1.next.XXXXXX"
                )" \
                  && chmod 600 "${legal_registry_marker_next}" \
                  && printf 'version=1\n' > "${legal_registry_marker_next}" \
                  && mv -f -- "${legal_registry_marker_next}" "${legal_registry_marker}"; then
                  legal_registry_marker_next=""
                else
                  echo "CLEANUP_FAILED: legal MCP migration marker installation failed."
                  legal_registry_cleanup_failed=1
                fi
              fi
              if [[ "${legal_registry_cleanup_failed}" -eq 0 ]] \
                && { [[ ! -f "${legal_registry_marker}" ]] \
                  || [[ -L "${legal_registry_marker}" ]] \
                  || [[ "$(stat -c '%u' "${legal_registry_marker}")" != "$(id -u)" ]] \
                  || [[ "$(stat -c '%a' "${legal_registry_marker}")" != "600" ]] \
                  || [[ "$(<"${legal_registry_marker}")" != "version=1" ]]; }; then
                echo "CLEANUP_FAILED: legal MCP migration marker validation failed."
                legal_registry_cleanup_failed=1
              fi

              if [[ -n "${legal_registry_marker_next}" ]]; then
                rm -f -- "${legal_registry_marker_next}" >/dev/null 2>&1 || true
              fi
              if [[ -n "${legal_registry_env_next}" ]]; then
                if ! rm -f -- "${legal_registry_env_next}" >/dev/null 2>&1 \
                  || [[ -e "${legal_registry_env_next}" || -L "${legal_registry_env_next}" ]]; then
                  legal_registry_cleanup_failed=1
                fi
                legal_registry_env_next=""
              fi

              if [[ "${legal_registry_cleanup_failed}" -ne 0 ]]; then
                echo "CLEANUP_FAILED: file-mode container remains active; migration finalization requires review."
                exit 71
              fi
              echo "Legal MCP file-registry migration committed and legacy rollback removed."
            elif [[ "${had_previous}" -eq 1 ]]; then
              echo "Previous container preserved as ${ROLLBACK_CONTAINER} for rollback."
            fi
            docker image prune -f || true

            deployment_phase="complete"
            echo "Deployment verified for git SHA ${EXPECTED_GIT_SHA} and digest ${EXPECTED_DIGEST}."
